<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Crack — impact, extend, shatter</title>
<style>
  :root {
    --ground:#000; --ink:#E6DDD2; --ink-soft:#CABEB0; --muted:#8C8177;
    --line:rgba(230,221,210,.13); --accent:#C0704A; --gold:#D28C5E;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
       line-height:1.55;overflow:hidden}

  /* The page as it looks before the strike — a stand-in for card 10. */
  #page{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
        justify-content:center;text-align:center;padding:2rem;
        transition:opacity .5s ease, filter .5s ease}
  #page.gone{opacity:0;filter:blur(2px)}
  h1{font-family:var(--serif);font-weight:500;font-size:clamp(1.6rem,4.5vw,2.4rem);
     margin:0 0 .6rem;max-width:24ch}
  p.sub{color:var(--muted);max-width:44ch;margin:0 0 2.4rem}
  .cta{display:inline-block;padding:.95rem 1.7rem;border-radius:999px;
       background:var(--accent);color:#140d09;text-decoration:none;border:none;
       font:inherit;font-size:1.05rem;cursor:pointer}
  .cta:hover{background:var(--gold)}
  .hint{position:fixed;left:0;right:0;bottom:1.2rem;text-align:center;color:var(--muted);
        font-size:.72rem;letter-spacing:.16em;text-transform:uppercase}

  /* Behind the glass: the rain, revealed as the shards fall away. */
  #behind{position:fixed;inset:0;opacity:0;transition:opacity .9s ease}
  #behind.on{opacity:1}
  #rain{position:absolute;inset:0;display:block;width:100%;height:100%}

  /* The whole world shakes, so the wrapper moves, not the individual layers. */
  #world{position:fixed;inset:0;will-change:transform}
  /* The recoil. One short, sharp kick at contact — the impact energy arriving,
     not the sustained earthquake that comes later with the typed lines. */
  .jolt{animation:jolt .22s cubic-bezier(.2,.9,.3,1) 1}
  @keyframes jolt{
    0%{transform:translate(0,0) scale(1)}
    18%{transform:translate(-6px,7px) scale(1.006)}
    44%{transform:translate(4px,-4px) scale(1.002)}
    72%{transform:translate(-2px,2px) scale(1)}
    100%{transform:translate(0,0) scale(1)}}
  .quake-1{animation:q1 .16s linear infinite}
  .quake-2{animation:q2 .09s linear infinite}
  @keyframes q1{
    0%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}
    50%{transform:translate(2px,-3px)}75%{transform:translate(-2px,-1px)}
    100%{transform:translate(0,0)}}
  @keyframes q2{
    0%{transform:translate(0,0) rotate(0)}20%{transform:translate(-9px,6px) rotate(-.35deg)}
    40%{transform:translate(8px,-7px) rotate(.3deg)}60%{transform:translate(-7px,-5px) rotate(-.2deg)}
    80%{transform:translate(6px,8px) rotate(.25deg)}100%{transform:translate(0,0) rotate(0)}}

  #msg{position:fixed;left:clamp(1.2rem,6vw,4rem);top:50%;transform:translateY(-50%);
       font:14px/1.9 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;
       color:#8FE9A8;text-shadow:0 0 10px rgba(80,255,140,.35);white-space:pre}
  #msg .ok{color:#CFF6DA}
  #msg .cur{background:#8FE9A8;color:#000}

  /* The countdown. The whole line pulses on each number, and the digit itself
     goes further — it is the thing actually changing. Retriggered by removing
     the class and forcing a reflow, same as .jolt. */
  #msg .beat{animation:cdBeat .92s ease-out}
  #msg .beat .n{animation:cdNum .92s ease-out;display:inline-block}
  @keyframes cdBeat{
    0%  {opacity:1;   text-shadow:0 0 26px rgba(80,255,140,.95),0 0 6px rgba(80,255,140,.8)}
    30% {opacity:.62; text-shadow:0 0 10px rgba(80,255,140,.35)}
    100%{opacity:1;   text-shadow:0 0 10px rgba(80,255,140,.35)}
  }
  @keyframes cdNum{
    0%  {transform:scale(1.75);color:#FFF}
    45% {transform:scale(1);   color:#8FE9A8}
    100%{transform:scale(1);   color:#8FE9A8}
  }
  @media (prefers-reduced-motion:reduce){
    #msg .beat,#msg .beat .n{animation:none}
  }

  #replay{position:fixed;right:1rem;bottom:1rem;z-index:50;background:none;
          border:1px solid var(--line);color:var(--muted);border-radius:999px;
          padding:.4rem .9rem;font:inherit;font-size:.75rem;cursor:pointer;display:none}
  #replay.on{display:block}
  #sound{position:fixed;right:1rem;top:1rem;z-index:50;background:none;
         border:1px solid var(--line);color:var(--muted);border-radius:999px;
         padding:.4rem .9rem;font:inherit;font-size:.72rem;letter-spacing:.12em;
         text-transform:uppercase;cursor:pointer}
  #sound.on{color:var(--accent);border-color:var(--accent)}
  #build{position:fixed;left:1rem;bottom:1rem;z-index:50;color:var(--muted);
         font:10px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;
         opacity:.55;pointer-events:none}
</style>
</head>
<body>

<div id="world">
  <div id="behind"><canvas id="rain"></canvas></div>

  <div id="page">
    <h1>A Robina land-and-lifestyle family home.</h1>
    <p class="sub">We'd lead on the land, the internal space and the pool — and let the
       right buyer see themselves in it.</p>
    <button class="cta" id="cta">Build my complete selling strategy →</button>
  </div>

  <div id="msg"></div>
</div>

<div class="hint" id="hint">Click or tap the button — or anywhere — to strike</div>
<button id="sound" class="on" aria-pressed="true">Sound on</button>
<button id="replay">Replay</button>
<div id="build">build 221128 · Studio-C</div>

<script src="glass-audio.js?v=221128"></script>
<script src="signal-bed.js?v=224400"></script>
<script src="crack.js?v=221128"></script>
<script>
(() => {
  "use strict";
  const page = document.getElementById("page");
  const world = document.getElementById("world");
  const behind = document.getElementById("behind");
  const msg = document.getElementById("msg");
  const hint = document.getElementById("hint");
  const replay = document.getElementById("replay");
  const cv = document.getElementById("rain");
  const ctx = cv.getContext("2d", { alpha: false });
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ── a compact rain field ───────────────────────────────────────────────────
  // Same look as the intro, but this one only has to fall and then switch off
  // right-to-left — it carries no recognition tiers, because by this point the
  // reader has already been shown their own street.
  const GLYPHS = ("0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ$%.,:/-+=<>#*" +
                  "0123456789").split("");
  const WORDS = ["ANALYSING", "COMPARABLE", "ADJUSTING", "POSITION", "STRATEGY",
                 "BUILDING", "SEQUENCE", "INDEXING", "VALUATION", "COMPILING",
                 "SORTING", "MATCHING", "BUYER POOL", "PRICE BAND", "TIMING"];
  let W, H, cw, ch, cols, rowsN, colLife, streams = [];

  function size() {
    const dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = "16px ui-monospace, Menlo, Consolas, monospace";
    cw = 13; ch = 19;
    cols = Math.ceil(W / cw); rowsN = Math.ceil(H / ch);
    colLife = new Float32Array(cols).fill(1);
    streams = [];
    for (let i = 0; i < cols; i++) {
      const n = 1 + (Math.random() < 0.4 ? 1 : 0);
      for (let k = 0; k < n; k++) streams.push(newStream(i, true));
    }
  }
  function newStream(col, spread) {
    return { col, y: spread ? -Math.random() * rowsN : -2,
             speed: 5 + Math.random() * 11, len: 8 + Math.random() * 18,
             word: Math.random() < 0.34 ? WORDS[(Math.random() * WORDS.length) | 0] : null,
             seed: Math.random() * 1e6 };
  }
  let last = 0, rainOn = false, shutdown = -1;
  function rainFrame(now) {
    if (!rainOn) return;
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    ctx.fillStyle = "rgba(0,0,0,0.22)";
    ctx.fillRect(0, 0, W, H);
    // right-to-left switch-off, mirroring the intro's collapse
    if (shutdown >= 0) {
      shutdown += dt / 3.0;   // right-to-left switch-off, 2x slower
      for (let i = 0; i < cols; i++) {
        const edge = 1 - shutdown;
        colLife[i] = i / cols > edge ? Math.max(0, colLife[i] - dt * 3.2) : colLife[i];
      }
    }
    for (const s of streams) {
      s.y += s.speed * dt;
      const life = colLife[s.col] || 0;
      if (life <= 0) continue;
      for (let k = 0; k < s.len; k++) {
        const y = Math.floor(s.y - k);
        if (y < 0 || y > rowsN) continue;
        const head = k === 0;
        const a = (1 - k / s.len) * life;
        let chr;
        if (s.word && k < s.word.length) chr = s.word[s.word.length - 1 - k];
        else chr = GLYPHS[(Math.floor(s.seed + y * 7 + k * 13 + now / 90) % GLYPHS.length + GLYPHS.length) % GLYPHS.length];
        ctx.fillStyle = head ? `rgba(210,255,225,${a})` : `rgba(60,235,120,${a * 0.8})`;
        ctx.fillText(chr, s.col * cw, y * ch);
      }
      if (s.y - s.len > rowsN) Object.assign(s, newStream(s.col, false));
    }
    requestAnimationFrame(rainFrame);
  }

  // ── the printed sequence ───────────────────────────────────────────────────
  const SCRIPT = [
    { t: "Analysing selling strategy...",     v: "01", after: () => {} },
    { t: "Construction sequence initiated..", v: "02", after: () => quake(1) },
    { t: "Approaching completion in T-3 seconds...", v: "03", after: () => quake(2),
      countdown: true },
    { t: "Construction completed.",           v: "04", after: () => quake(0), ok: true },
  ];

  // The ship's computer. Four fixed lines, generated once by build_voice.py —
  // see there for why this is a build step rather than the browser's own
  // speechSynthesis. Preloaded so a line never stutters on first play.
  const VOICE = {};
  let voiceMeta = null;
  // Bump on every build_voice.py run. 03.mp3 changes content but keeps its name,
  // and a cached one would leave her saying the old line under the new caption.
  const VOICE_V = "?v=20260803b";
  fetch("voice/index.json" + VOICE_V).then((r) => r.json()).then((m) => {
    voiceMeta = m;
    for (const l of m.lines) {
      const a = new Audio("voice/" + l.file + VOICE_V);
      a.preload = "auto"; a.volume = 0.85;
      VOICE[l.id] = { audio: a, seconds: l.seconds };
    }
  }).catch(() => {});
  function quake(level) {
    world.classList.remove("quake-1", "quake-2");
    if (level && !reduced) world.classList.add("quake-" + level);
  }
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  async function type(line) {
    const row = document.createElement("div");
    if (line.ok) row.className = "ok";
    msg.appendChild(row);

    // Pace the typing to the speech, not the other way round. A fixed
    // characters-per-second either finishes early and leaves the voice talking
    // to a static line, or lags behind it — and the mismatch is the thing that
    // makes captioned voice look cheap.
    const v = sound && VOICE[line.v];
    let per = 52, dot = 180, spoke = 0;
    if (v) {
      // "Construction completed." is the cue for the signal to go. It stops the
      // moment she starts saying it, so the last line lands in silence — which
      // is the point: the transmission was the build running, and the build has
      // finished.
      if (line.ok) FieldsSignalBed.stop(0.2);
      else FieldsSignalBed.duck(0.5, 0.25);
      try { v.audio.currentTime = 0; v.audio.play(); spoke = performance.now(); } catch (_) {}
      const visible = line.t.replace(/\./g, "").length;
      const dots = line.t.length - visible;
      // hold the last ~18% of the clip for the tail of the sentence
      per = Math.max(24, (v.seconds * 1000 * 0.82 - dots * 120) / Math.max(1, visible));
      dot = 120;
    }
    for (let i = 1; i <= line.t.length; i++) {
      row.textContent = line.t.slice(0, i);
      await wait(line.t[i - 1] === "." ? dot : per);
    }
    if (line.countdown) {
      // The typing is paced to 82% of the clip, so the last character lands
      // while she is still finishing the sentence. Every other line has a 500ms
      // gap after it that absorbs this; the countdown chains straight on, so
      // without an explicit hold "Three" starts 0.55s on top of "...seconds".
      // Measured, not guessed — it was doing exactly that.
      if (v && spoke) {
        await wait(Math.max(0, v.seconds * 1000 - (performance.now() - spoke) + 200));
      }
      // Fire the shake FIRST so it escalates through the count rather than
      // arriving after it. The count is the tense part; that is where it belongs.
      line.after();
      await countdown(row, line.t);
      return;                       // stays ducked — line 04 kills the bed anyway
    }
    if (v && !line.ok) FieldsSignalBed.unduck(0.4);
    line.after();
  }

  // Swap the "3" in "…T-3 seconds…" for a live digit and count it down. The beat
  // is a flat 1s, so the countdown genuinely takes the three seconds she just
  // promised — the clips are 0.5-0.65s, so each number lands and then hangs.
  const COUNT = ["c3", "c2", "c1"];
  async function countdown(row, text) {
    const at = text.indexOf("3");
    row.textContent = "";
    const n = document.createElement("span");
    n.className = "n";
    row.append(text.slice(0, at), n, text.slice(at + 1));

    for (let i = 0; i < COUNT.length; i++) {
      n.textContent = String(3 - i);
      const c = sound && VOICE[COUNT[i]];
      if (c) { try { c.audio.currentTime = 0; c.audio.play(); } catch (_) {} }
      row.classList.remove("beat"); void row.offsetWidth; row.classList.add("beat");
      await wait(1000);
    }
    row.classList.remove("beat");
  }

  // ── the whole sequence ─────────────────────────────────────────────────────
  // Sized at load so the canvas is opaque black from the start — that black is
  // what shows through the impact hole and through every gap the falling glass
  // leaves. The code itself does not start until the glass has completely gone.
  size();
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);

  // Sound is ON by default. Nothing plays until the CTA is clicked, and that
  // click is the user gesture browsers require, so there is no autoplay problem
  // — the arming happens inside the handler either way. The toggle stays, so a
  // reader who is somewhere they cannot have sound can kill it before pressing
  // the button.
  let sound = true;
  const soundBtn = document.getElementById("sound");
  soundBtn.addEventListener("click", () => {
    sound = !sound;
    soundBtn.classList.toggle("on", sound);
    soundBtn.textContent = sound ? "Sound on" : "Sound off";
    soundBtn.setAttribute("aria-pressed", String(sound));
    if (sound) FieldsSignalBed.arm(FieldsGlassAudio.arm());   // arm inside the gesture
  });
  FieldsSignalBed.fetch();     // network now, decode when armed

  let running = false;
  async function run(x, y) {
    if (running) return;
    running = true;
    hint.style.display = "none";
    // Arm here too: this IS the gesture, and every browser blocks audio until
    // one. Doing it in the click handler is what makes the sound legal to play.
    if (sound && !reduced) FieldsSignalBed.arm(FieldsGlassAudio.arm());

    // ?seq=full brings back the crack that runs to the top and the gap that
    // opens along it. Default is the pane sequence on its own.
    const SEQ = new URLSearchParams(location.search).get("seq") || "network";

    FieldsCrack.strike(x, y, {
      reveal: cv,
      skipGash: SEQ !== "full",
      onImpact: () => {
        if (reduced) return;
        if (sound) FieldsGlassAudio.impact();
        world.classList.remove("jolt"); void world.offsetWidth;
        world.classList.add("jolt");
      },
      // The copy stays readable THROUGH the cracked glass — that is the whole
      // idea — and only goes when the pane starts falling.
      onNetwork: () => { if (sound && !reduced) FieldsGlassAudio.crackle(900); },
      onFall: () => {
        page.classList.add("gone");
        if (sound && !reduced) FieldsGlassAudio.shatter(3800);
      },
      onDone: async () => {
        // Now, and not before: the glass has completely shattered and fallen,
        // so the code starts on an empty screen rather than being glimpsed
        // through it.
        behind.classList.add("on");
        rainOn = true; last = performance.now();
        requestAnimationFrame(rainFrame);

        // The signal comes up one second behind the code, over 1.5s. Deliberately
        // AFTER the rain rather than with it: arriving second, out of nothing,
        // reads as something being picked up. Arriving together reads as a cue.
        if (sound && !reduced) {
          setTimeout(() => FieldsSignalBed.start({ fadeIn: 1.5 }), 1000);
        }

        await wait(2200);
        shutdown = 0;                       // code switches off right to left
        await wait(3000);
        for (const line of SCRIPT) { await type(line); await wait(sound ? 500 : 850); }
        await wait(1600);
        quake(0);
        replay.classList.add("on");
        dispatchEvent(new CustomEvent("fields:strategy-built"));
      },
    });
  }

  document.getElementById("cta").addEventListener("click", (e) => {
    e.preventDefault();
    run(e.clientX, e.clientY);
  });
  // anywhere else, so the epicentre is easy to test at the edges and corners
  addEventListener("pointerdown", (e) => {
    if (e.target.closest("#cta") || e.target.closest("#replay")) return;
    run(e.clientX, e.clientY);
  });
  replay.addEventListener("click", () => location.reload());
  addEventListener("resize", () => { if (rainOn) size(); });
})();
</script>
</body>
</html>
