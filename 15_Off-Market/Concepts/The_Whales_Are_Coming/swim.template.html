<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>The Whales Are Coming — swim study</title>

<style>
  :root {
    --paper: #0d1620; --ink: #e8eef4; --dim: #7b8b9c; --line: #1e2c3a;
    --accent: #6fb3c9;
  }
  [data-theme="ink"] {
    --paper: #000000; --ink: #e6ddd2; --dim: #6f6a63; --line: #241f1a;
    --accent: #e6ddd2;
  }
  [data-theme="light"] {
    --paper: #f2efe8; --ink: #1d2630; --dim: #6c7784; --line: #ddd7cb;
    --accent: #2b6d85;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header { padding: 22px 24px 10px; }
  h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .01em; }
  h1 span { color: var(--dim); font-weight: 400; }
  .stage { padding: 0 24px; }
  canvas { display: block; width: 100%; height: auto; border-radius: 3px; }

  .readout {
    display: flex; flex-wrap: wrap; gap: 0 26px;
    padding: 14px 24px 0; color: var(--dim);
    font: 12px/1.7 ui-monospace, "SF Mono", Menlo, monospace;
  }
  .readout b { color: var(--ink); font-weight: 600; }
  .readout .warn { color: #d98a4a; }

  .panel {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 4px 26px; padding: 16px 24px 40px; max-width: 1400px;
  }
  .panel h2 {
    grid-column: 1 / -1; margin: 18px 0 2px; font-size: 11px; font-weight: 600;
    letter-spacing: .09em; text-transform: uppercase; color: var(--dim);
    border-top: 1px solid var(--line); padding-top: 12px;
  }
  .panel h2:first-of-type { margin-top: 4px; }
  label { display: grid; grid-template-columns: 1fr auto; align-items: center;
          gap: 0 10px; padding: 3px 0; }
  label > span:first-child { color: var(--dim); }
  label > output { font: 12px ui-monospace, Menlo, monospace; color: var(--ink); }
  input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent);
                      margin: 2px 0 0; }
  .row { grid-column: 1 / -1; display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  button {
    font: 12px/1 inherit; padding: 8px 14px; border-radius: 3px; cursor: pointer;
    color: var(--ink); background: transparent; border: 1px solid var(--line);
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  .note { grid-column: 1/-1; color: var(--dim); font-size: 12px; max-width: 64ch;
          margin-top: 8px; }
</style>

<header>
  <h1>The Whales Are Coming <span>— procedural swim study, Whale_V2</span></h1>
</header>

<div class="stage"><canvas id="c"></canvas></div>
<div class="readout" id="readout"></div>
<div class="panel" id="panel"></div>

<script>
// ---------------------------------------------------------------------------
// Three layers — far flipper, body, near flipper — over a travelling body wave.
//
// The body is sliced into vertical strips and re-laid along the wave: each strip
// is translated by the local displacement and rotated by the local slope, about
// the spine point measured out of the matte. At rest every strip lands exactly
// where it was drawn, so the pose is the artist's.
//
// The whole animal moves, and it moves the way it was MEASURED to move.
//
// Fish, Peacock & Rohr (2003), "Stabilization mechanism in swimming odontocete
// cetaceans by phased movements", Mar. Mammal Sci. 19(3):515-528, digitised four
// points — rostrum, flipper tip, peduncle, fluke tip — across seven species at
// 1.4-7.3 m/s. Their result overturns the obvious model:
//
//   * Amplitudes rank  fluke > peduncle > rostrum > FLIPPER.  The flipper tip
//     has the SMALLEST excursion of the four, because it sits nearest the centre
//     of mass. It is a measured node, and it sits right where the flippers
//     attach — which is why the amplitude envelope here dips to a minimum at
//     the flipper hinges rather than ramping monotonically.
//
//   * The rostrum moves very nearly IN PHASE with the flukes: -9.4 to +33.0
//     degrees, statistically indistinguishable from zero in two species. A rigid
//     beam pivoting about its centre would put them 180 degrees apart. The
//     animal is actively cancelling that. Verbatim: "By synchronously moving the
//     rostrum in the same direction as flukes by muscular control, there is a
//     reduction in the natural tendency of the rostrum to swing through a wide
//     arc opposite the motion of the flukes."
//
//   * Rostrum amplitude is 0.02-0.06 body lengths against 0.17-0.25 for the
//     fluke — a ratio of 4.34 to 6.76. The head moves, but by a fifth or less.
//
//   * The flippers TRAIL the flukes by 60.9 to 123.4 degrees and oppose pitching.
//
// So the body is modelled in two zones that meet at the node: a travelling wave
// behind it, and an anterior section whose phase is prescribed against the
// fluke rather than inherited from the wave. That split is not a convenience —
// it is what the muscular control described above actually does.
//
// The passive momentum balance (Lighthill recoil) is still here, on a slider
// defaulting to ZERO — and zero is the CORRECT default for a second reason
// beyond the muscular stabilisation above. Measured envelopes are fits to
// observed motion, and observed motion already contains whatever recoil the
// animal did not cancel. Adding a recoil term on top double-counts it. Maertens,
// Gao & Triantafyllou (2017, JFM 813:301) make this explicit by setting their
// recoil term B(x,t) = 0 for the canonical carangiform gait, precisely because
// the envelope came from Videler's measurements. Solve the momentum balance only
// if you are prescribing a pure BENDING wave and deriving the rigid motions
// yourself — never on top of a measured envelope.
// ---------------------------------------------------------------------------

const RIG = {{RIG_JSON}};
const SRC = {
  body: "{{BODY_DATA_URI}}",
  near: "{{NEAR_DATA_URI}}",
  far:  "{{FAR_DATA_URI}}",
};

// Defaults are the measured humpback, not round numbers.
//   L       13.50 m      Woodward, Winn & Fish 2006, J. Morphol. 267:1284, n=128
//   U       2.0 m/s      Gough et al. 2019/2021 tag data (1.77-2.09)
//   A/L     0.20 p-p     Gough et al. 2019 direct fluke-tag measure; A = L/5 convention
//   f       ~0.23 Hz     Gough et al. 2019, 0.229 +/- 0.039 Hz over n=97 deployments
// St is set so the Strouhal lock reproduces that measured frequency. Note the
// tension: the one humpback with a directly measured St came in at 0.24, but at
// a faster 2.61 m/s. Gough et al. also found frequency scales as L^-0.53 where
// an optimal-Strouhal oscillator predicts L^-1.0 — their conclusion is that
// whales are NOT operating as simple Strouhal machines. The lock is kept here
// because it is a good animation control, not because the animal obeys it.
const P = {
  // hydrodynamics
  St:        0.31,   // reproduces f = 0.23 Hz at L=13.5, U=2.0, A/L=0.20
  U:         2.0,    // cruising speed, m/s
  L:         13.5,   // body length, m
  ampFrac:   0.20,   // fluke peak-to-peak amplitude, as a fraction of L
  lambda:    1.80,   // set so the peduncle leads the fluke by ~38 deg (meas. 19-49)
  // anterior section — prescribed against the fluke, per Fish et al. 2003
  rosAmp:    0.19,   // rostrum amplitude / fluke amplitude (measured 0.148-0.230)
  rosPhase:  20,     // degrees relative to the fluke (measured -9.4 to +33.0)
  nodeAt:    0.28,   // the measured minimum — it sits at the flipper attachment
  antSharp:  1.4,    // how fast the anterior section falls away toward the node
  sharp:     1.8,    // how fast the posterior wave grows behind the node
  recoil:    0.0,    // OFF: measured envelopes already contain recoil (see above)
  // burst and coast
  beats:     3.5,
  glide:     5.0,
  drag:      0.030,
  // flippers — smallest excursion of the four measured points, trailing the fluke
  flipAmp:   0.10,   // rad of blade rotation
  flipPhase: 90,     // degrees trailing the fluke (measured 60.9-123.4)
  flipLag:   0.10,   // s of compliance
  // blink
  blinkEvery: 11.0,  // mean seconds between blinks (jittered)
  blinkDur:   0.55,  // seconds for the whole close-hold-open stroke
  // staging
  size:      0.42,
  depth:     0.50,
  strips:    3,
  motes:     true,
  spine:     false,
  theme:     "{{THEME_DEFAULT}}",
};

const CANVAS_W = 1600, CANVAS_H = 720;
const cv = document.getElementById("c");
cv.width = CANVAS_W; cv.height = CANVAS_H;
const ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = true;
ctx.imageSmoothingQuality = "high";

// --- mass distribution, for the recoil balance -----------------------------

const NS = 96;                 // samples along the body for the momentum sums
const SU = new Float64Array(NS);   // u of each sample
const SX = new Float64Array(NS);   // sprite x of each sample
const SM = new Float64Array(NS);   // mass weight
let XCM = 0, MTOT = 0;

(function buildMass() {
  const W = RIG.width, th = RIG.thickness;
  for (let i = 0; i < NS; i++) {
    const x = ((i + 0.5) / NS) * W;
    SX[i] = x;
    SU[i] = 1 - x / W;
    const t = th[Math.min(Math.floor(x), th.length - 1)];
    SM[i] = t * t;             // slender-body: mass and added mass ~ cross-section
  }
  for (let i = 0; i < NS; i++) { MTOT += SM[i]; XCM += SM[i] * SX[i]; }
  XCM /= MTOT;
})();

// --- the body wave ---------------------------------------------------------

function fitEnvelope() { /* nothing to precompute — kept for call-site symmetry */ }

// Phase of the fluke tip, which everything anterior is referenced against.
const flukePhase = (phase) => phase - (2 * Math.PI) / P.lambda;

// Two zones meeting at the node.
//
// Behind the node: a travelling wave, growing toward the flukes. Points nearer
// the nose lead, which is what gives the peduncle its phase lead over the fluke
// and lets the blade meet the water at an angle instead of just wagging.
//
// Ahead of the node: amplitude and phase prescribed directly against the fluke.
// This is the muscular stabilisation Fish et al. measured — the head tracks the
// flukes rather than reacting against them, and a travelling wave cannot produce
// that at the same time as the peduncle's lead.
function rawDisp(u, phase, on) {
  const ampPx = (P.ampFrac * RIG.width) / 2;    // peak-to-peak -> single-sided
  const n = Math.max(P.nodeAt, 1e-4);

  const tp = Math.max(0, (u - n) / (1 - n));
  const post = Math.pow(tp, P.sharp) *
               Math.sin(phase - (2 * Math.PI * u) / P.lambda);

  const ta = Math.max(0, (n - u) / n);
  const ant = P.rosAmp * Math.pow(ta, P.antSharp) *
              Math.sin(flukePhase(phase) - (P.rosPhase * Math.PI) / 180);

  return ampPx * on * (post + ant);
}

// Lighthill's recoil: the prescribed wave carries net lateral momentum and net
// angular momentum, which a free-swimming animal cannot. Subtracting the rigid
// heave and pitch that zero both is what makes the head swing against the tail.
let H0 = 0, T0 = 0;
function solveRecoil(phase, on) {
  if (P.recoil <= 0) { H0 = 0; T0 = 0; return; }
  let s = 0, sm = 0, si = 0;
  for (let i = 0; i < NS; i++) s += SM[i] * rawDisp(SU[i], phase, on);
  const h = s / MTOT;                                   // zero net momentum
  for (let i = 0; i < NS; i++) {
    const r = SX[i] - XCM;
    sm += SM[i] * r * (rawDisp(SU[i], phase, on) - h);
    si += SM[i] * r * r;
  }
  H0 = h * P.recoil;
  T0 = (sm / si) * P.recoil;                            // zero net moment
}

const disp = (u, phase, on) =>
  rawDisp(u, phase, on) - H0 - T0 * ((1 - u) * RIG.width - XCM);

// --- state -----------------------------------------------------------------

const freqAt = (v) => (P.St * Math.abs(v)) / Math.max(P.ampFrac * P.L, 1e-6);
const pxPerM = () => (CANVAS_W * P.size) / P.L;

const S = { t: 0, phase: 0, v: 0, x: 0, cycleT: 0, motes: [],
            flip: { near: 0, far: 0 }, hingeY: { near: 0, far: 0 },
            blinkU: 0, blinkT: 0, blinkNext: 0, seed: 1 };

// Deterministic PRNG. Blink timing is jittered, but the capture renderer
// re-integrates every frame from t=0, so the jitter has to replay identically
// or the eye would flicker at random between frames of the same render.
function rnd() {
  S.seed = (S.seed * 1664525 + 1013904223) >>> 0;
  return S.seed / 4294967296;
}
const nextBlinkGap = () => P.blinkEvery * (0.55 + 0.9 * rnd());

function resetSim() {
  S.t = 0; S.phase = 0; S.v = P.U * 0.85; S.cycleT = 0; S.x = 0;
  S.flip.near = S.flip.far = 0;
  S.hingeY.near = S.hingeY.far = 0;
  S.seed = 20260802; S.blinkU = 0; S.blinkT = 0; S.blinkNext = nextBlinkGap();
  S.motes = Array.from({ length: 90 }, () => ({
    x: Math.random() * CANVAS_W, y: Math.random() * CANVAS_H,
    z: 0.25 + Math.random() * 1.0, r: 0.6 + Math.random() * 1.8,
  }));
}

function strokeEnvelope(cycleT) {
  const burst = P.beats / Math.max(freqAt(P.U), 1e-6);
  const total = burst + P.glide;
  if (P.glide <= 0.01) return { on: 1, total };
  const ramp = Math.min(0.9 / Math.max(freqAt(P.U), 1e-6), burst * 0.45);
  let on = 0;
  if (cycleT < burst) {
    on = Math.min(Math.min(cycleT / ramp, 1), Math.min((burst - cycleT) / ramp, 1));
  }
  return { on: on * on * (3 - 2 * on), total };
}

function step(dt) {
  fitEnvelope();
  const { on, total } = strokeEnvelope(S.cycleT);
  const thrust = P.drag * P.U * P.U;
  S.v += (thrust * on - P.drag * S.v * S.v) * dt;
  S.v = Math.max(S.v, 0);
  S.x += S.v * dt;
  S.phase += 2 * Math.PI * freqAt(S.v) * dt;
  S.cycleT = (S.cycleT + dt) % total;
  S.t += dt;
  solveRecoil(S.phase, on);

  // Flippers trail the flukes by 60.9-123.4 degrees and oppose pitching (Fish,
  // Peacock & Rohr 2003). Driving them off that measured phase lag rather than
  // off a feathering model is the honest choice: no one has published a flipper
  // sweep or pitch time series for steady straight-line cetacean swimming, and
  // the descriptive work (Edel & Winn 1978; Segre et al. 2017) has them acting
  // as near-static trim surfaces in cruise, saving the big strokes for banking
  // turns and lunges. So this is deliberately small.
  const target = P.flipAmp *
                 Math.sin(flukePhase(S.phase) - (P.flipPhase * Math.PI) / 180) * on;
  const a = 1 - Math.exp(-dt / Math.max(P.flipLag, 1e-3));
  for (const k of ["near", "far"]) S.flip[k] += (target - S.flip[k]) * a;

  const ppm = pxPerM();

  if (S.blinkU > 0) {
    S.blinkU += dt / Math.max(P.blinkDur, 1e-3);
    if (S.blinkU >= 1) { S.blinkU = 0; S.blinkT = 0; S.blinkNext = nextBlinkGap(); }
  } else if ((S.blinkT += dt) >= S.blinkNext) {
    S.blinkU = 1e-6;
  }

  for (const m of S.motes) {
    m.x -= S.v * ppm * dt * m.z * 0.55;
    if (m.x < -8) { m.x = CANVAS_W + 8; m.y = Math.random() * CANVAS_H; }
  }
  return on;
}

// --- draw ------------------------------------------------------------------

const IMG = {};

const INK_PAPER = "#000000", INK_COLOUR = "#e6ddd2";

function paintWater() {
  const ink = P.theme === "ink", dark = P.theme === "dark";

  if (ink) {
    // Flat black. The treatment's whole premise is that paper becomes ground
    // and only strokes carry light — a gradient or a light shaft would put
    // luminance back into the ground and the effect collapses.
    ctx.fillStyle = INK_PAPER;
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
  } else {
    const g = ctx.createLinearGradient(0, 0, 0, CANVAS_H);
    if (dark) { g.addColorStop(0, "#16283a"); g.addColorStop(0.55, "#0d1927"); g.addColorStop(1, "#070e17"); }
    else      { g.addColorStop(0, "#e9e6dd"); g.addColorStop(0.6, "#dcdbd3"); g.addColorStop(1, "#cfd2cd"); }
    ctx.fillStyle = g; ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

    ctx.save();
    ctx.globalAlpha = dark ? 0.055 : 0.05;
    ctx.fillStyle = dark ? "#a9d8ee" : "#ffffff";
    for (let i = 0; i < 7; i++) {
      const x = ((i * 251) % CANVAS_W) + Math.sin(S.t * 0.11 + i) * 26;
      ctx.save(); ctx.translate(x, 0); ctx.rotate(0.13 + i * 0.012);
      ctx.fillRect(-45, -60, 90, CANVAS_H * 1.35); ctx.restore();
    }
    ctx.restore();
  }

  if (!P.motes) return;
  ctx.save();
  ctx.fillStyle = ink ? INK_COLOUR : (dark ? "#cfe6f2" : "#8d9aa2");
  for (const m of S.motes) {
    ctx.globalAlpha = (ink ? 0.13 : dark ? 0.20 : 0.16) * m.z;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r * m.z, 0, 6.2832); ctx.fill();
  }
  ctx.restore();
}

// vertical displacement of the body at sprite column x
const dispAt = (x, phase, on) => disp(1 - x / RIG.width, phase, on);

// local slope of the displacement field, for anything that needs to sit tangent
function slopeAt(x, phase, on) {
  const h = 3;
  return (dispAt(x + h, phase, on) - dispAt(x - h, phase, on)) / (2 * h);
}

function paintFlipper(g, k, on, ph) {
  const f = RIG.flippers[k];
  // The hinge rides at its OWN height on the body — the shoulder, down at the
  // belly — not on the spine. It is carried by the wave like every other point
  // of the body, and tilts with the local slope, then adds its own feathering.
  const y = f.hinge_abs_y + dispAt(f.hinge_abs_x, ph, on);
  g.save();
  g.translate(f.hinge_abs_x, y);
  g.rotate(Math.atan(slopeAt(f.hinge_abs_x, ph, on)) + S.flip[k]);
  g.drawImage(IMG[k], -f.hinge_x, -f.hinge_y, f.w, f.h);
  g.restore();
}

// The blink.
//
// The lid is the band of skin directly above the eye, stretched downward over
// it and anchored at the band's top edge — so it is the artist's own hatching
// doing the closing, and no gap can open behind it. A painted lid or an
// inpainted socket would have to invent texture that matches a pen drawing, and
// at this magnification it would not.
//
// Shape of the stroke is fast down, brief hold, slower up. A symmetric blink
// reads as a twitch; the asymmetry is what makes it look like an eyelid.
function blinkAmount(u) {
  if (u <= 0) return 0;
  if (u >= 1) return 0;
  let t;
  if (u < 0.30) t = u / 0.30;                 // close
  else if (u < 0.45) t = 1;                   // hold shut
  else t = 1 - (u - 0.45) / 0.55;             // open, slower
  return t * t * (3 - 2 * t);                 // smoothstep
}

let eyeCv = null, eyeCx = null;
const EYE_PAD = 14;
const EYE_STRIP = 2;

// A cetacean blink is a PURSE, not a shutter. The orbicularis oculi closes the
// palpebral fissure using the medial and lateral canthi as fulcrums, so both
// margins converge on a mid-line and the movement tapers to nothing at the
// corners — which is why the closing margins bow rather than staying straight.
// Drawn in narrow vertical strips so each column can carry its own travel.
const canthusTaper = (t) => Math.pow(Math.sin(Math.PI * Math.min(Math.max(t, 0), 1)), 0.55);

function paintEye(g, ph, on) {
  const E = RIG.eye;
  if (!E || P.blinkEvery <= 0) return;
  const shut = blinkAmount(S.blinkU);
  if (shut <= 0.001) return;

  const cx = E.x + E.w / 2, cy = E.y + E.h / 2;
  const bx = E.x - EYE_PAD, by = E.y - EYE_PAD;
  const w = E.w + EYE_PAD * 2, h = E.h + EYE_PAD * 2;
  const upSrcY = E.lid_open_y - E.lid_src_h;
  const upReach = (E.meet_y - E.lid_open_y) * shut;
  const loReach = (E.lower_open_y - E.meet_y) * shut;

  if (!eyeCv) { eyeCv = document.createElement("canvas"); eyeCx = eyeCv.getContext("2d"); }
  if (eyeCv.width !== w || eyeCv.height !== h) { eyeCv.width = w; eyeCv.height = h; }
  eyeCx.clearRect(0, 0, w, h);

  for (let x = 0; x < w; x += EYE_STRIP) {
    const sw = Math.min(EYE_STRIP, w - x);
    const k = canthusTaper((x + sw / 2 - EYE_PAD) / E.w);
    if (k <= 0.001) continue;

    // upper lid: skin from above, stretched down, anchored at its own top edge
    const up = upReach * k;
    eyeCx.drawImage(IMG.body, bx + x, upSrcY, sw, E.lid_src_h,
                    x, upSrcY - by, sw, E.lid_src_h + up);

    // lower lid: tissue from below, stretched up, anchored at its bottom edge
    const lo = loReach * k;
    eyeCx.drawImage(IMG.body, bx + x, E.lower_open_y, sw, E.lower_src_h,
                    x, E.lower_open_y - by - lo, sw, E.lower_src_h + lo);

    // the closing line where the two margins meet
    if (shut > 0.30) {
      const y = E.lower_open_y - by - lo;
      const a = 0.5 * (shut - 0.30) / 0.70 * k;
      const g = eyeCx.createLinearGradient(0, y - 3, 0, y + 0.5);
      g.addColorStop(0, "rgba(38,34,30,0)");
      g.addColorStop(1, `rgba(38,34,30,${a})`);
      eyeCx.fillStyle = g;
      eyeCx.fillRect(x, y - 3, sw, 3.5);
    }
  }

  // Feather to an ellipse. A hard-edged rectangle of skin pasted over hatching
  // announces itself immediately; bounding the lids to a soft-edged almond means
  // they can only ever cover the eye opening, and the edge dissolves into the
  // surrounding lid tissue instead of cutting across it.
  eyeCx.save();
  eyeCx.globalCompositeOperation = "destination-out";
  eyeCx.translate(w / 2, h / 2);
  eyeCx.scale(1, h / w);
  const fg = eyeCx.createRadialGradient(0, 0, w * 0.26, 0, 0, w * 0.50);
  fg.addColorStop(0, "rgba(0,0,0,0)");
  fg.addColorStop(1, "rgba(0,0,0,1)");
  eyeCx.fillStyle = fg;
  eyeCx.fillRect(-w, -w, 2 * w, 2 * w);
  eyeCx.restore();

  // rotate about the EYE'S OWN CENTRE. Rotating about (cx, displacement) puts
  // the pivot ~390px above the eye and swings the patch clear of the socket.
  g.save();
  g.translate(cx, cy + dispAt(cx, ph, on));
  g.rotate(Math.atan(slopeAt(cx, ph, on)) + (E.angle_deg * Math.PI) / 180);
  g.translate(-cx, -cy);
  // the globe retracts as the lids close, so the socket sits fractionally deeper
  if (shut > 0.2) {
    g.globalAlpha = 0.16 * (shut - 0.2) / 0.8;
    g.fillStyle = P.theme === "ink" ? "#000000" : "#1d1a17";
    g.beginPath();
    g.ellipse(cx, cy, E.w * 0.40, E.h * 0.34, 0, 0, 6.2832);
    g.fill();
    g.globalAlpha = 1;
  }
  g.drawImage(eyeCv, bx, by);
  g.restore();
}

let bodyCv = null, bodyCx = null;

function paintWhale(on) {
  const W = RIG.width, H = RIG.height;
  const scale = (CANVAS_W * P.size) / W;
  const noseX = S.x * pxPerM();
  const ph = S.phase;

  // Compose the animal at 1:1 sprite scale, then scale the whole thing once.
  //
  // Drawing the strips straight onto the scaled main canvas puts every strip
  // boundary on a fractional device pixel, so each strip antialiases its own
  // edges and adjacent edges do not sum to full coverage. With opaque sprites
  // that is invisible; with semi-transparent ink it is not, and it cannot be
  // patched by overlapping — a 1px overlap double-composites and comes out too
  // bright (27% swing across strip settings), no overlap leaves gaps and comes
  // out too dark (6%). At 1:1 the boundaries are integers, drawImage does no
  // edge AA, and the strips tile exactly. Verified strip-count invariant.
  const padY = Math.ceil(0.6 * P.ampFrac * W) + 24;   // room for the wave to swing
  const ch = H + padY * 2;
  if (!bodyCv) { bodyCv = document.createElement("canvas"); bodyCx = bodyCv.getContext("2d"); }
  if (bodyCv.width !== W || bodyCv.height !== ch) { bodyCv.width = W; bodyCv.height = ch; }
  bodyCx.clearRect(0, 0, W, ch);
  bodyCx.imageSmoothingEnabled = true;
  bodyCx.imageSmoothingQuality = "high";

  bodyCx.save();
  bodyCx.translate(0, padY);

  paintFlipper(bodyCx, "far", on, ph);              // behind the body

  const stepPx = Math.max(1, Math.round(P.strips));
  for (let sx = 0; sx < W; sx += stepPx) {
    const sw = Math.min(stepPx, W - sx);
    const d0 = dispAt(sx, ph, on);
    const k = (dispAt(sx + sw, ph, on) - d0) / sw;
    bodyCx.save();
    bodyCx.transform(1, k, 0, 1, 0, d0 - k * sx);
    bodyCx.drawImage(IMG.body, sx, 0, sw, H, sx, 0, sw, H);
    bodyCx.restore();
  }

  paintEye(bodyCx, ph, on);
  paintFlipper(bodyCx, "near", on, ph);             // in front of the body

  if (P.spine) {
    bodyCx.strokeStyle = "#ff4d6d"; bodyCx.lineWidth = 2;
    bodyCx.beginPath();
    for (let sx = 0; sx < W; sx += stepPx) {
      const y = RIG.centre[Math.min(sx, RIG.centre.length - 1)] + dispAt(sx, ph, on);
      sx === 0 ? bodyCx.moveTo(sx, y) : bodyCx.lineTo(sx, y);
    }
    bodyCx.stroke();
    for (const k of ["near", "far"]) {
      const f = RIG.flippers[k];
      bodyCx.fillStyle = "#4dd6ff";
      bodyCx.beginPath();
      bodyCx.arc(f.hinge_abs_x, f.hinge_abs_y + dispAt(f.hinge_abs_x, ph, on), 7, 0, 6.2832);
      bodyCx.fill();
    }
  }
  bodyCx.restore();

  ctx.save();
  ctx.translate(noseX - W * scale, CANVAS_H * P.depth - (H * scale) / 2);
  ctx.scale(scale, scale);
  ctx.drawImage(bodyCv, 0, -padY);
  ctx.restore();
}

function frame(on) { paintWater(); paintWhale(on); updateReadout(on); }

// --- readout ---------------------------------------------------------------

function updateReadout(on) {
  const f = freqAt(S.v);
  const screenM = CANVAS_W / pxPerM();
  const bad = P.St < 0.20 || P.St > 0.35;   // Rohr & Fish 2004: 74% of cetaceans sit 0.20-0.30
  // how far the nose actually travels, as a fraction of the fluke's throw
  const amp = (u) => {
    let lo = 1e9, hi = -1e9;
    for (let i = 0; i < 48; i++) {
      const ph = (i / 48) * 2 * Math.PI;
      solveRecoil(ph, 1);
      const d = disp(u, ph, 1);
      lo = Math.min(lo, d); hi = Math.max(hi, d);
    }
    return hi - lo;
  };
  const noseAmp = amp(0), tailAmp = amp(1);
  const nr = 100 * noseAmp / Math.max(tailAmp, 1e-6);
  solveRecoil(S.phase, on);
  document.getElementById("readout").innerHTML = [
    `tail beat <b>${f.toFixed(3)} Hz</b> (${f > 0 ? (1 / f).toFixed(1) : "—"} s)`,
    `speed <b>${S.v.toFixed(2)} m/s</b>`,
    `stroke <b>${on > 0.02 ? "burst" : "glide"}</b>`,
    `rostrum <b class="${nr < 14.8 || nr > 23.0 ? "warn" : ""}">${nr.toFixed(0)}%</b> of fluke (meas. 15-23)`,
    `rostrum A <b>${(100 * noseAmp / (RIG.width)).toFixed(1)}%</b> L (meas. 2-6)`,
    `screen <b>${screenM.toFixed(0)} m</b>`,
    `St <b class="${bad ? "warn" : ""}">${P.St.toFixed(2)}</b>`,
  ].join("&nbsp;&nbsp;·&nbsp;&nbsp;");
}

// --- controls --------------------------------------------------------------

const CONTROLS = [
  ["h", "Hydrodynamics"],
  ["St", "Strouhal number", 0.18, 0.50, 0.01, v => v.toFixed(2)],
  ["U", "Cruise speed (m/s)", 0.4, 5, 0.1, v => v.toFixed(1)],
  ["L", "Body length (m)", 7, 20, 0.5, v => v.toFixed(1) + " m"],
  ["ampFrac", "Fluke amplitude (A/L, p-p)", 0.04, 0.40, 0.01, v => v.toFixed(2)],
  ["h", "Body wave — measured, Fish/Peacock/Rohr 2003"],
  ["rosAmp", "Rostrum amp (of fluke)", 0, 0.6, 0.01, v => v.toFixed(2) + (v>=0.148&&v<=0.230?" \u2713":"")],
  ["rosPhase", "Rostrum phase vs fluke", -180, 180, 5, v => v.toFixed(0) + "\u00b0" + (v>=-9.4&&v<=33?" \u2713":"")],
  ["nodeAt", "Node (at the flippers)", 0.05, 0.6, 0.01, v => v.toFixed(2)],
  ["lambda", "Wavelength (body lengths)", 0.4, 2.0, 0.05, v => v.toFixed(2)],
  ["antSharp", "Anterior falloff", 0.5, 4, 0.1, v => v.toFixed(1)],
  ["sharp", "Posterior growth", 0.5, 4, 0.1, v => v.toFixed(1)],
  ["recoil", "Passive recoil (double-counts \u2014 demo only)", 0, 1.5, 0.05, v => v.toFixed(2)],
  ["h", "Flippers"],
  ["flipAmp", "Blade rotation (rad)", 0, 0.5, 0.01, v => v.toFixed(2)],
  ["flipPhase", "Trailing the fluke", 0, 180, 5, v => v.toFixed(0) + "\u00b0" + (v>=61&&v<=123?" \u2713":"")],
  ["flipLag", "Compliance lag (s)", 0.01, 0.8, 0.01, v => v.toFixed(2) + " s"],
  ["h", "Blink"],
  ["blinkEvery", "Mean interval (s)", 0, 40, 0.5, v => v <= 0 ? "off" : v.toFixed(1) + " s"],
  ["blinkDur", "Stroke duration (s)", 0.15, 2.0, 0.05, v => v.toFixed(2) + " s"],
  ["h", "Burst and coast"],
  ["beats", "Beats per burst", 1, 8, 0.5, v => v.toFixed(1)],
  ["glide", "Glide (s)", 0, 14, 0.5, v => v.toFixed(1) + " s"],
  ["drag", "Drag", 0.005, 0.12, 0.005, v => v.toFixed(3)],
  ["h", "Staging"],
  ["size", "Whale size (of frame)", 0.12, 0.9, 0.01, v => (v * 100).toFixed(0) + "%"],
  ["depth", "Depth on screen", 0.15, 0.85, 0.01, v => v.toFixed(2)],
  ["strips", "Strip width (px)", 1, 8, 1, v => v.toFixed(0)],
];

function buildPanel() {
  const panel = document.getElementById("panel");
  for (const c of CONTROLS) {
    if (c[0] === "h") {
      const h = document.createElement("h2"); h.textContent = c[1];
      panel.appendChild(h); continue;
    }
    const [key, label, min, max, stepv, fmt] = c;
    const el = document.createElement("label");
    el.innerHTML = `<span>${label}</span><output></output>`;
    const inp = document.createElement("input");
    Object.assign(inp, { type: "range", min, max, step: stepv, value: P[key] });
    const out = el.querySelector("output");
    out.textContent = fmt(P[key]);
    inp.oninput = () => { P[key] = +inp.value; out.textContent = fmt(P[key]); };
    el.appendChild(inp); panel.appendChild(el);
  }
  const row = document.createElement("div"); row.className = "row";
  const toggle = (label, key) => {
    const b = document.createElement("button");
    b.textContent = label; b.onclick = () => { P[key] = !P[key]; };
    return b;
  };
  const themeBtn = document.createElement("button");
  themeBtn.textContent = "Theme";
  themeBtn.onclick = () => {
    // The whale sprites are baked per theme: index.html carries the tonal
    // drawing, index_ink.html the cream-on-black ink layers. Switching the
    // ground here does NOT restyle the animal — open the other page for that.
    const order = ["dark", "light", "ink"];
    P.theme = order[(order.indexOf(P.theme) + 1) % order.length];
    document.documentElement.dataset.theme = P.theme === "dark" ? "" : P.theme;
  };
  const replay = document.createElement("button");
  replay.textContent = "Replay"; replay.onclick = resetSim;
  const save = document.createElement("button");
  save.textContent = "Save frame";
  save.onclick = () => {
    const a = document.createElement("a");
    a.download = "whale_swim.png"; a.href = cv.toDataURL("image/png"); a.click();
  };
  row.append(replay, themeBtn, toggle("Motes", "motes"), toggle("Rig", "spine"), save);
  panel.appendChild(row);

  const note = document.createElement("div");
  note.className = "note";
  note.innerHTML =
    "Ticks mark values inside the measured range. The head moves nearly IN " +
    "phase with the flukes \u2014 not against them: a rigid beam would put them " +
    "180\u00b0 apart, and a live cetacean spends muscle cancelling exactly that. " +
    "Push <b>Passive recoil</b> up to see the anti-phase see-saw the animal is " +
    "working to suppress. The amplitude minimum sits at the flippers because " +
    "that is where it was measured \u2014 the flipper tip has the smallest " +
    "excursion of the four digitised points.";
  panel.appendChild(note);
}

// --- URL params ------------------------------------------------------------

const qs = new URLSearchParams(location.search);
for (const k of Object.keys(P)) {
  if (!qs.has(k)) continue;
  const raw = qs.get(k);
  P[k] = (typeof P[k] === "boolean") ? raw !== "0" && raw !== "false"
       : (typeof P[k] === "number")  ? +raw : raw;
}
if (P.theme === "light") document.documentElement.dataset.theme = "light";
if (P.theme === "ink") document.documentElement.dataset.theme = "ink";

// --- run -------------------------------------------------------------------

Promise.all(Object.entries(SRC).map(([k, src]) => new Promise((res) => {
  const im = new Image();
  im.onload = () => { IMG[k] = im; res(); };
  im.src = src;
}))).then(() => {
  buildPanel();
  fitEnvelope();
  resetSim();

  if (qs.get("capture") === "1") {
    window.__swim = {
      frame(tSec, fps) {
        const dt = 1 / (fps || 30);
        resetSim();
        let on = 0;
        for (let t = 0; t < tSec; t += dt) on = step(dt);
        frame(on);
      },
      params: P,
    };
    return;
  }

  let last = performance.now();
  (function loop(now) {
    const dt = Math.min((now - last) / 1000, 1 / 20);
    last = now;
    frame(step(dt));
    requestAnimationFrame(loop);
  })(last);
});
</script>
