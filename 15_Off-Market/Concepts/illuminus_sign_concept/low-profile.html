<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Illuminus Low — monument sign concept</title>
<style>
/* ============================================================================
   ILLUMINUS LOW — the CTA as a low, elongated monument sign seen at an angle.

   Unlike index.html (flat-on) this is a real 3D object in CSS: a slab with a
   front face, a narrow TOP surface, and a left end cap, standing on two short
   legs about a metre off the ground, lighting the ground beneath and in front
   of it. The camera sits left of centre and slightly above, so the top surface
   reads as a surface rather than an edge.

   Discharge physics is identical to index.html — same engine, new staging.
   ========================================================================== */
:root{
  --ink:#E6DDD2; --muted:#8C8177;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

  --gas:#F0793E; --gas-deep:#B2401A; --core:#FFF6EE; --gas-cold:#FF9A7A;
  --glass:#5C6157;          /* unlit tube: pale grey-green, always present */

  /* camera — driven by the sliders */
  --yaw:40deg;              /* + = viewer left of centre, sees the left end   */
  --pitch:-17deg;           /* - = viewer above, looking down on the top face */
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:#000; color:var(--ink); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; display:grid; grid-template-rows:1fr auto; overflow:hidden}

/* ---- stage --------------------------------------------------------------- */
.scene{
  position:relative; overflow:hidden;
  display:grid; place-items:center;
  /* A long lens. At 1500px the near end of a 860px slab balloons — you are
     effectively standing 1.5 m from a 3 m sign. 2800px reads like viewing it
     from across a driveway, which is how a monument sign is actually seen. */
  perspective:2800px; perspective-origin:50% 38%;
  background:linear-gradient(#05070C 0%,#070910 45%,#0A0A0C 100%);
}
/* The leading translate is applied LAST (transform lists compose left-to-right
   as matrices, so the rightmost acts on the point first). It lifts the whole
   scene in screen space to leave room for the ground below the sign — without
   it the ground plane's centre projects past the bottom of the viewport and
   the sign appears to float in a void. */
.world{ position:relative; transform-style:preserve-3d;
  transform:translateY(-9%) rotateX(var(--pitch)) rotateY(var(--yaw)); }

/* ---- the ground ----------------------------------------------------------
   Both planes live INSIDE .rig so they can use its --w/--h/--legH and are
   positioned against the sign rather than the viewport.

   The camera pitch is deliberately shallow ("gently downward"), which means a
   horizontal plane is seen almost edge-on. A huge ground plane at that angle
   projects into a skewed smear that wanders off frame, so the dark surface and
   the light pool are separate: .ground is a modest backdrop, and .pool is a
   small plane scaled to the sign and pinned under it, which cannot wander.  */
.ground{
  position:absolute; left:50%; top:50%;
  width:calc(var(--w) * 3.2); height:900px;
  transform:translate(-50%,-50%) translateY(calc(var(--h)/2 + var(--legH)))
            rotateX(90deg) translateY(300px);
  background:linear-gradient(#08080A, #0C0C0D 55%, #0F0E0D);
}
.pool{
  position:absolute; left:50%; top:50%;
  width:calc(var(--w) * 1.7); height:calc(var(--w) * 0.52);
  /* Only a small forward shift. The offset runs along the sign's own normal,
     which the 40° yaw then swings to screen-right — push it much further and
     the pool visibly detaches from under the sign. */
  transform:translate(-50%,-50%) translateY(calc(var(--h)/2 + var(--legH)))
            rotateX(90deg) translateY(calc(var(--w) * 0.06));
  background:radial-gradient(50% 50% at 50% 50%,
      rgb(255 165 105 / calc(.42 * var(--bloom,0))) 0%,
      rgb(230 110 55  / calc(.22 * var(--bloom,0))) 34%,
      rgb(170 60 25   / calc(.08 * var(--bloom,0))) 62%,
      transparent 82%);
}
/* asphalt grain — dark gradients band badly on 8-bit panels */
.ground::after{
  content:""; position:absolute; inset:0; opacity:.16; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'>\
<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/>\
<feColorMatrix type='saturate' values='0'/></filter>\
<rect width='160' height='160' filter='url(%23n)' opacity='.4'/></svg>");
}

/* ---- the slab ------------------------------------------------------------ */
.rig{ position:relative; transform-style:preserve-3d;
  --w:min(80vw, 860px); --h:calc(var(--w)/4.4); --d:46px;
  /* Sign face reads as ~0.9 m tall, so ~1 m of air under it is a shade over
     one face-height. Any more and it stops being a low monument sign. */
  --legH:calc(var(--h)*1.1);
  width:var(--w); height:var(--h); }

.slab{ position:absolute; inset:0; transform-style:preserve-3d;
  text-decoration:none; cursor:pointer; -webkit-tap-highlight-color:transparent; }
.slab:focus-visible{outline:2px solid var(--gas); outline-offset:20px}

.slab > *{position:absolute; left:50%; top:50%}

/* front face — carries the tube and the lettering */
.face{
  width:var(--w); height:var(--h);
  transform:translate(-50%,-50%) translateZ(calc(var(--d)/2));
  border-radius:calc(var(--h)/2);
  /* the cabinet face is lit by its own tube — a dark panel with a live tube on
     it is never as black as an unlit one */
  background:
    radial-gradient(70% 120% at 50% 50%,
      rgb(240 121 62 / calc(.10 * var(--lvl,0))), transparent 70%),
    linear-gradient(#141518,#0E0F12 60%,#0A0B0D);
  box-shadow:inset 0 1px 0 rgb(255 255 255/.05), inset 0 0 50px rgb(0 0 0/.75);
  display:grid; place-items:center;
}
/* narrow TOP surface — the reason for the camera angle. It sits right against
   the tube, so it catches the most spill of any surface on the sign. */
.top{
  width:var(--w); height:var(--d);
  transform:translate(-50%,-50%) rotateX(90deg) translateZ(calc(var(--h)/2));
  border-radius:calc(var(--d)/2);
  /* This surface is the whole point of the camera angle, and physically it is
     the brightest non-emitting part of the sign: it sits millimetres from the
     tube and faces up into its spill. The bright edge is the FRONT lip (local
     bottom once laid flat), nearest the tube. */
  background:
    linear-gradient(to top,
      rgb(255 190 140 / calc(.55 * var(--lvl,0))) 0%,
      rgb(240 121 62  / calc(.34 * var(--lvl,0))) 22%,
      rgb(240 121 62  / calc(.12 * var(--lvl,0))) 55%,
      transparent 88%),
    linear-gradient(#2A2C31,#1C1E22 55%,#131417);
}
/* left end cap — visible because the camera is left of centre */
.endL{
  width:var(--d); height:var(--h);
  transform:translate(-50%,-50%) rotateY(-90deg) translateZ(calc(var(--w)/2));
  border-radius:calc(var(--d)/2);
  background:
    linear-gradient(90deg, rgb(255 180 130 / calc(.34 * var(--lvl,0))),
                           rgb(240 121 62 / calc(.12 * var(--lvl,0))) 45%, transparent 82%),
    linear-gradient(#212328,#141519);
}
.back{
  width:var(--w); height:var(--h);
  transform:translate(-50%,-50%) translateZ(calc(var(--d)/-2)) rotateY(180deg);
  border-radius:calc(var(--h)/2); background:#0A0B0D;
}

/* ---- tube + lettering, both in the face's own local space ---------------- */
.frame{position:absolute; inset:0; overflow:visible; pointer-events:none}
.frame path,.frame line{fill:none; stroke-linecap:round; stroke-linejoin:round}
.t-glass{stroke:var(--glass); stroke-width:5; opacity:.42}
.t-outer{stroke:var(--gas-deep); stroke-width:24; filter:blur(16px);
  opacity:calc(.55 * var(--bloom,0) * (1 - .65 * var(--warm,0)))}
.t-mid  {stroke:var(--gas); stroke-width:12; filter:blur(6.5px); opacity:calc(.8 * var(--lvl,0))}
.t-near {stroke:var(--gas); stroke-width:6;  filter:blur(2.3px); opacity:calc(.92 * var(--lvl,0))}
.t-core {stroke:var(--core); stroke-width:2.4; filter:blur(.5px); opacity:calc(1 * var(--lvl,0))}
.t-elec {stroke:var(--gas-cold); stroke-width:8.5; filter:blur(5px); opacity:calc(.75 * var(--lvl,0))}
.lead   {stroke:#2A2724; stroke-width:2; opacity:.9}
.housing{fill:#141210; stroke:#2A2724; stroke-width:1}

.word{display:grid; place-items:center; position:relative; z-index:1}
.word > span{
  grid-area:1/1; white-space:nowrap; text-align:center;
  font-size:calc(var(--w) * .042); font-weight:600;
  letter-spacing:.12em; text-transform:uppercase; line-height:1.4;
  color:transparent; -webkit-text-stroke:1.7px var(--glass);
}
.glass{-webkit-text-stroke-color:rgb(92 97 87 / .5)}
.lit{
  -webkit-text-stroke-color:rgb(255 246 238 / calc(1 * var(--lvl,0)));
  text-shadow:
    0 0 calc(2px  + 1px  * var(--bloom,0)) rgb(255 246 238 / calc(1   * var(--lvl,0))),
    0 0 calc(5px  + 3px  * var(--bloom,0)) rgb(255 214 180 / calc(.95 * var(--lvl,0))),
    0 0 calc(12px + 8px  * var(--bloom,0)) rgb(240 121 62  / calc(.95 * var(--lvl,0))),
    0 0 calc(26px + 18px * var(--bloom,0)) rgb(240 121 62  / calc(.7  * var(--bloom,0))),
    0 0 calc(52px + 38px * var(--bloom,0)) rgb(178 64 26   / calc(.45 * var(--bloom,0) * (1 - .6 * var(--warm,0))));
}

/* ---- legs ---------------------------------------------------------------- */
.leg{position:absolute; left:50%; top:50%; transform-style:preserve-3d;
  width:30px; height:var(--legH)}
.leg > i{position:absolute; inset:0; display:block; border-radius:2px}
.leg > i.f{transform:translateZ(14px);
  background:linear-gradient(90deg,#0C0D0F,#2C2E34 42%,#15171A)}
.leg > i.s{width:28px; transform:rotateY(-90deg) translateZ(15px);
  background:linear-gradient(#1B1D21,#0E0F12)}
.legL{transform:translate(-50%,-50%) translateX(calc(var(--w)/-4))
      translateY(calc(var(--h)/2 + var(--legH)/2))}
.legR{transform:translate(-50%,-50%) translateX(calc(var(--w)/4))
      translateY(calc(var(--h)/2 + var(--legH)/2))}

/* ---- panel --------------------------------------------------------------- */
.panel{display:flex; flex-wrap:wrap; align-items:center; gap:.55rem;
  padding:.8rem clamp(1rem,4vw,2rem) 1rem;
  border-top:1px solid rgb(230 221 210/.09); background:#050403}
.panel button{font:inherit; font-size:.74rem; letter-spacing:.1em; text-transform:uppercase;
  color:#CABEB0; background:transparent; border:1px solid rgb(230 221 210/.18);
  border-radius:999px; padding:.48rem .95rem; cursor:pointer}
.panel button:hover{border-color:var(--gas); color:var(--gas)}
.panel button[aria-pressed="true"]{border-color:var(--gas); color:var(--gas);
  background:rgb(240 121 62/.10)}
.ctrl{display:flex; align-items:center; gap:.5rem; font-size:.68rem;
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
.ctrl input{width:120px; accent-color:#F0793E}
.ctrl b{color:#CABEB0; font-variant-numeric:tabular-nums; min-width:3.4em}
.spacer{flex:1 1 1rem}
.readout{font-size:.68rem; letter-spacing:.09em; text-transform:uppercase;
  color:var(--muted); font-variant-numeric:tabular-nums}
.readout b{color:#CABEB0}
</style>
</head>
<body>

<main class="scene">
  <div class="world" id="world">
    <div class="rig" id="rig">
      <div class="ground"></div>
      <div class="pool"></div>
      <a class="slab" id="slab" href="#build-strategy">
        <div class="back"></div>
        <div class="endL"></div>
        <div class="top"></div>
        <div class="face" id="face">
          <svg class="frame" id="frame" aria-hidden="true"></svg>
          <span class="word">
            <span class="glass" aria-hidden="true">Build my complete selling strategy&#8202;&#8202;&#8594;</span>
            <span class="lit">Build my complete selling strategy&#8202;&#8202;&#8594;</span>
          </span>
        </div>
      </a>
      <div class="leg legL"><i class="f"></i><i class="s"></i></div>
      <div class="leg legR"><i class="f"></i><i class="s"></i></div>
    </div>
  </div>
</main>

<div class="panel">
  <button id="replay">Replay</button>
  <button id="reseed">New flicker</button>
  <button id="safe" aria-pressed="true">Flash-safe</button>
  <button id="calm" aria-pressed="false">Reduced motion</button>
  <span class="ctrl">Yaw <input id="yaw" type="range" min="0" max="70" value="40"><b id="yawV">40°</b></span>
  <span class="ctrl">Pitch <input id="pitch" type="range" min="0" max="45" value="13"><b id="pitchV">17°</b></span>
  <span class="spacer"></span>
  <span class="readout">Phase <b id="r-phase">—</b> &nbsp; Emission <b id="r-lvl">0%</b></span>
</div>

<script>
"use strict";
/* ==========================================================================
   Discharge engine — identical to index.html. Notes live in that file and in
   README.md; the short version is that a neon tube switches in microseconds
   with no afterglow, so the tube edge is a hard step and only the halo lags,
   and every frame is the 1 kHz time-integral of emission across that frame so
   the 100 Hz mains ripple cannot alias into a 20 Hz strobe at 60 fps.
   ========================================================================== */
const MAINS_HZ=50, RIPPLE_HZ=MAINS_HZ*2, RIPPLE_DEPTH=0.14;
const RIPPLE_NORM=1/(1-RIPPLE_DEPTH/2);
const SUB_MS=1, TAU_ATTACK=12, TAU_RELEASE=55;
const PULSES=3, PULSE_MS=1150, PULSE_FLOOR=0.30;
const DARK_MS=420, HOLD_MS=3800, REST_MS=900;
const SAFE_MIN_STRIKE_GAP=340;
let SAFE=true;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function buildTake(seed){
  const rnd=mulberry32(seed); const seg=[]; let t=0;
  const push=(d,o)=>{seg.push(Object.assign({t0:t,t1:t+d},o)); t+=d;};
  push(DARK_MS,{kind:"dark",phase:"dark"});
  for(let i=0;i<PULSES;i++) push(PULSE_MS,{kind:"pulse",phase:"pulse "+(i+1)+"/"+PULSES});
  const n=7+Math.floor(rnd()*4);
  for(let i=0;i<n;i++){
    const last=i===n-1;
    push(rnd()<0.22?180+rnd()*260:14+rnd()*95,{kind:"off",phase:"flicker"});
    if(rnd()<0.55) push(5+rnd()*16,{kind:"partial",a:0.18+rnd()*0.28,phase:"flicker"});
    let on=last?240+rnd()*120:28+rnd()*190;
    if(SAFE) on=Math.max(on,SAFE_MIN_STRIKE_GAP);
    push(on,{kind:"on",a:0.86+rnd()*0.14,ph:rnd()*6.283,phase:"flicker"});
  }
  push(HOLD_MS,{kind:"steady",phase:"steady"});
  push(REST_MS,{kind:"dark",phase:"dark"});
  return {seg,total:t,seed};
}
function ripple(t){
  const ph=2*Math.PI*RIPPLE_HZ*(t/1000);
  return (1-RIPPLE_DEPTH*(0.5-0.5*Math.cos(ph)))*RIPPLE_NORM;
}
function emit(take,t){
  const T=take.total; t=((t%T)+T)%T;
  let s=take.seg[take.seg.length-1];
  for(let i=0;i<take.seg.length;i++){ if(t<take.seg[i].t1){ s=take.seg[i]; break; } }
  const u=(t-s.t0)/(s.t1-s.t0);
  switch(s.kind){
    case "dark":    return {a:0,warm:0,phase:s.phase};
    case "off":     return {a:0,warm:1,phase:s.phase};
    case "partial": return {a:s.a,warm:1,phase:s.phase};
    case "pulse":{
      const a=PULSE_FLOOR+(1-PULSE_FLOOR)*Math.sin(Math.PI*u)**2;
      return {a:Math.min(1,a*ripple(t)),warm:(1-a)*0.35,phase:s.phase};
    }
    case "on":{
      const age=t-s.t0;
      const wob=1+0.13*Math.sin(2*Math.PI*62*(age/1000)+s.ph)*Math.exp(-age/22);
      return {a:Math.min(1,s.a*wob*ripple(t)),warm:0.25*Math.exp(-age/60),phase:s.phase};
    }
    case "steady":{
      const drift=1+0.012*Math.sin(t/730)+0.007*Math.sin(t/271);
      return {a:Math.min(1,ripple(t)*drift),warm:0,phase:s.phase};
    }
  }
  return {a:0,warm:0,phase:"dark"};
}

/* ---- driver -------------------------------------------------------------- */
const root=document.documentElement;
const face=document.getElementById("face");
const frame=document.getElementById("frame");
const slab=document.getElementById("slab");
const rPhase=document.getElementById("r-phase"), rLvl=document.getElementById("r-lvl");

let take=buildTake(20260803);
let t0=performance.now(), prevT=0, bloom=0, warmS=0;
let calm=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* The tube path is built in the face's OWN layout space. getBoundingClientRect
   would return the screen-space bounding box of a 3D-rotated element, which is
   not the face's geometry — offsetWidth/offsetHeight are the untransformed
   size and are what the SVG viewBox needs. */
function drawFrame(){
  const w=face.offsetWidth, h=face.offsetHeight;
  if(!w||!h) return;
  const rad=Math.min(h/2,h/2), gap=26;
  const d=[`M ${w/2-gap/2} ${h}`,`H ${rad}`,`A ${rad} ${rad} 0 0 1 0 ${h-rad}`,
    `V ${rad}`,`A ${rad} ${rad} 0 0 1 ${rad} 0`,`H ${w-rad}`,
    `A ${rad} ${rad} 0 0 1 ${w} ${rad}`,`V ${h-rad}`,
    `A ${rad} ${rad} 0 0 1 ${w-rad} ${h}`,`H ${w/2+gap/2}`].join(" ");
  const L=w/2-gap/2, R=w/2+gap/2;
  frame.setAttribute("viewBox",`0 0 ${w} ${h}`);
  frame.innerHTML=`
    <path class="t-glass" d="${d}"/><path class="t-outer" d="${d}"/>
    <path class="t-mid" d="${d}"/><path class="t-near" d="${d}"/>
    <line class="t-elec" x1="${L-16}" y1="${h}" x2="${L}" y2="${h}"/>
    <line class="t-elec" x1="${R}" y1="${h}" x2="${R+16}" y2="${h}"/>
    <path class="t-core" d="${d}"/>
    <line class="lead" x1="${L}" y1="${h}" x2="${L}" y2="${h+10}"/>
    <line class="lead" x1="${R}" y1="${h}" x2="${R}" y2="${h+10}"/>
    <rect class="housing" x="${L-4}" y="${h+8}" width="${gap+8}" height="7" rx="2"/>`;
}

function step(now){
  requestAnimationFrame(step);
  if(calm){
    root.style.setProperty("--lvl","1");
    root.style.setProperty("--bloom","1");
    root.style.setProperty("--warm","0");
    rPhase.textContent="reduced motion"; rLvl.textContent="100%";
    return;
  }
  const t=now-t0;
  const win=Math.min(t-prevT,120);
  const steps=Math.max(1,Math.round(win/SUB_MS)), dt=win/steps;
  let sum=0,warmSum=0,phase="";
  for(let i=0;i<steps;i++){
    const e=emit(take,prevT+dt*(i+0.5));
    sum+=e.a; warmSum+=e.warm; phase=e.phase;
    const tau=e.a>bloom?TAU_ATTACK:TAU_RELEASE;
    bloom+=(e.a-bloom)*(1-Math.exp(-dt/tau));
  }
  prevT=t;
  const lvl=sum/steps;
  warmS+=(warmSum/steps-warmS)*0.25;
  root.style.setProperty("--lvl",lvl.toFixed(4));
  root.style.setProperty("--bloom",bloom.toFixed(4));
  root.style.setProperty("--warm",warmS.toFixed(4));
  rPhase.textContent=phase; rLvl.textContent=Math.round(lvl*100)+"%";
}

/* ---- controls ------------------------------------------------------------ */
function restart(seed){
  take=buildTake(seed===undefined?take.seed:seed);
  t0=performance.now(); prevT=0; bloom=0; warmS=0;
}
document.getElementById("replay").onclick=()=>restart();
document.getElementById("reseed").onclick=()=>restart((Math.random()*1e9)|0);
document.getElementById("safe").onclick=e=>{
  SAFE=!SAFE; e.currentTarget.setAttribute("aria-pressed",String(SAFE)); restart();
};
document.getElementById("calm").onclick=e=>{
  calm=!calm; e.currentTarget.setAttribute("aria-pressed",String(calm)); if(!calm) restart();
};
const yaw=document.getElementById("yaw"), pitch=document.getElementById("pitch");
const yawV=document.getElementById("yawV"), pitchV=document.getElementById("pitchV");
function cam(){
  root.style.setProperty("--yaw", yaw.value+"deg");
  root.style.setProperty("--pitch", (-pitch.value)+"deg");
  yawV.textContent=yaw.value+"°"; pitchV.textContent=pitch.value+"°";
}
yaw.oninput=cam; pitch.oninput=cam; cam();
slab.addEventListener("click",e=>{e.preventDefault(); restart();});

new ResizeObserver(drawFrame).observe(face);
addEventListener("resize",drawFrame);
drawFrame();
requestAnimationFrame(step);
</script>
</body>
</html>
