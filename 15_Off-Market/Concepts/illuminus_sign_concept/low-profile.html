<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Illuminus Low — monument sign concept</title>
<style>
/* ============================================================================
   ILLUMINUS LOW — the CTA as a low, elongated monument sign seen at an angle.

   Unlike index.html (flat-on) this is a real 3D object in CSS: a slab with a
   front face, a narrow TOP surface, and a left end cap, standing on two short
   legs about a metre off the ground, lighting the ground beneath and in front
   of it. The camera sits left of centre and slightly above, so the top surface
   reads as a surface rather than an edge.

   Discharge physics is identical to index.html — same engine, new staging.
   ========================================================================== */
:root{
  --ink:#E6DDD2; --muted:#8C8177;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

  --gas:#F0793E; --gas-deep:#B2401A; --core:#FFF6EE; --gas-cold:#FF9A7A;
  --glass:#5C6157;          /* unlit tube: pale grey-green, always present */

  /* camera — driven by the sliders */
  --yaw:40deg;              /* + = viewer left of centre, sees the left end   */
  --pitch:-17deg;           /* - = viewer above, looking down on the top face */
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:#000; color:var(--ink); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; display:grid; grid-template-rows:1fr auto; overflow:hidden}

/* ---- stage --------------------------------------------------------------- */
.scene{
  position:relative; overflow:hidden;
  display:grid; place-items:center;
  /* A long lens. At 1500px the near end of a 860px slab balloons — you are
     effectively standing 1.5 m from a 3 m sign. 2800px reads like viewing it
     from across a driveway, which is how a monument sign is actually seen. */
  perspective:2800px; perspective-origin:50% 38%;
  background:linear-gradient(#05070C 0%,#070910 45%,#0A0A0C 100%);
}
/* ---- lens ----------------------------------------------------------------
   Everything above is the scene. This is the CAMERA, and it is most of what
   separates a render from a photograph of a sign at night.

   .glare  — veiling glare: a bright source at night smears light across the
             whole frame via scatter in the lens and in your own eye. Elongated
             and rotated to lie along the sign's on-screen axis, because the
             source is a long horizontal tube, not a point.
   ::after — vignette plus grain, which unify the frame and kill the banding
             that dark gradients always produce on 8-bit panels.              */
.glare{
  position:absolute; inset:0; z-index:5; pointer-events:none;
  mix-blend-mode:screen;              /* over a near-black scene this is additive */
  /* Gradients sit at the element's own centre, and the element is then moved
     onto the sign. Offsetting the gradient inside the element instead makes
     the rotation swing it away from the source — glare has to stay centred on
     the thing that is glowing. */
  background:
    radial-gradient(44% 16% at 50% 50%,
      rgb(255 170 110 / calc(.19 * var(--bloom,0))) 0%,
      rgb(220 100 45  / calc(.08 * var(--bloom,0))) 45%,
      transparent 78%),
    radial-gradient(76% 8% at 50% 50%,
      rgb(255 190 140 / calc(.11 * var(--bloom,0))) 0%, transparent 72%);
  transform:translate(-2.5%,-5.5%) rotate(-13deg) scale(1.3);
}
.scene::after{           /* vignette only — plain black, composited normally */
  content:""; position:absolute; inset:0; z-index:6; pointer-events:none;
  background:radial-gradient(78% 78% at 50% 45%, transparent 40%, rgb(0 0 0/.6) 100%);
}
/* Grain must MODULATE the frame, not cover it. background-blend-mode only
   blends an element's own background layers against each other — the element
   itself still composites normally, so mid-grey noise painted at any real
   opacity lifts the blacks to grey. mix-blend-mode is the one that blends
   against the scene, and at overlay it needs very little opacity to work. */
.grain{
  position:absolute; inset:0; z-index:7; pointer-events:none;
  mix-blend-mode:overlay; opacity:.05;
  background-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'>\
<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3'/>\
<feColorMatrix type='saturate' values='0'/></filter>\
<rect width='150' height='150' filter='url(%23n)'/></svg>");
}
/* The leading translate is applied LAST (transform lists compose left-to-right
   as matrices, so the rightmost acts on the point first). It lifts the whole
   scene in screen space to leave room for the ground below the sign — without
   it the ground plane's centre projects past the bottom of the viewport and
   the sign appears to float in a void. */
.world{ position:relative; transform-style:preserve-3d;
  transform:translateY(-9%) rotateX(var(--pitch)) rotateY(var(--yaw)); }

/* ---- the ground ----------------------------------------------------------
   Both planes live INSIDE .rig so they can use its --w/--h/--legH and are
   positioned against the sign rather than the viewport.

   The camera pitch is deliberately shallow ("gently downward"), which means a
   horizontal plane is seen almost edge-on. A huge ground plane at that angle
   projects into a skewed smear that wanders off frame, so the dark surface and
   the light pool are separate: .ground is a modest backdrop, and .pool is a
   small plane scaled to the sign and pinned under it, which cannot wander.  */
.ground{
  position:absolute; left:50%; top:50%;
  width:calc(var(--w) * 3.2); height:900px;
  transform:translate(-50%,-50%) translateY(calc(var(--h)/2 + var(--legH)))
            rotateX(90deg) translateY(300px);
  background:linear-gradient(#08080A, #0C0C0D 55%, #0F0E0D);
}
.pool{
  position:absolute; left:50%; top:50%;
  width:calc(var(--w) * 1.7); height:calc(var(--w) * 0.52);
  /* Only a small forward shift. The offset runs along the sign's own normal,
     which the 40° yaw then swings to screen-right — push it much further and
     the pool visibly detaches from under the sign. */
  transform:translate(-50%,-50%) translateY(calc(var(--h)/2 + var(--legH)))
            rotateX(90deg) translateY(calc(var(--w) * 0.06));
  background:radial-gradient(50% 50% at 50% 50%,
      rgb(255 165 105 / calc(.42 * var(--bloom,0))) 0%,
      rgb(230 110 55  / calc(.22 * var(--bloom,0))) 34%,
      rgb(170 60 25   / calc(.08 * var(--bloom,0))) 62%,
      transparent 82%);
}
/* asphalt grain — dark gradients band badly on 8-bit panels */
.ground::after{
  content:""; position:absolute; inset:0; opacity:.16; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'>\
<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/>\
<feColorMatrix type='saturate' values='0'/></filter>\
<rect width='160' height='160' filter='url(%23n)' opacity='.4'/></svg>");
}

/* ---- the slab ------------------------------------------------------------ */
.rig{ position:relative; transform-style:preserve-3d;
  --w:min(80vw, 860px); --h:calc(var(--w)/4.4); --d:46px;
  /* Sign face reads as ~0.9 m tall, so ~1 m of air under it is a shade over
     one face-height. Any more and it stops being a low monument sign. */
  --legH:calc(var(--h)*1.1);
  width:var(--w); height:var(--h); }

.slab{ position:absolute; inset:0; transform-style:preserve-3d;
  text-decoration:none; cursor:pointer; -webkit-tap-highlight-color:transparent; }
.slab:focus-visible{outline:2px solid var(--gas); outline-offset:20px}

.slab > *{position:absolute; left:50%; top:50%}

/* front face — carries the tube and the lettering */
.face{
  width:var(--w); height:var(--h);
  transform:translate(-50%,-50%) translateZ(calc(var(--d)/2));
  border-radius:calc(var(--h)/2);
  /* Deliberately near-black. The old version washed a broad orange haze across
     the whole panel, which is the single biggest "CG" tell — real cabinet paint
     next to a tube falls off FAST, bright at the rim and dark two hand-widths
     in. The falloff now comes from inset shadows, which follow the rounded-rect
     exactly, instead of from a fat blurred SVG stroke bleeding inward. */
  background:linear-gradient(#101114,#0B0C0F 55%,#08090B);
  box-shadow:
    inset 0 0 calc(4px  + 3px  * var(--bloom,0)) rgb(255 214 180 / calc(.55 * var(--lvl,0))),
    inset 0 0 calc(16px + 12px * var(--bloom,0)) rgb(240 121 62  / calc(.40 * var(--lvl,0))),
    inset 0 0 calc(52px + 34px * var(--bloom,0)) rgb(200 82  35  / calc(.22 * var(--lvl,0))),
    inset 0 1px 0 rgb(255 255 255/.05),
    inset 0 0 70px rgb(0 0 0/.85);
  display:grid; place-items:center;
}
/* narrow TOP surface — the reason for the camera angle. It sits right against
   the tube, so it catches the most spill of any surface on the sign. */
.top{
  width:var(--w); height:var(--d);
  transform:translate(-50%,-50%) rotateX(90deg) translateZ(calc(var(--h)/2));
  border-radius:calc(var(--d)/2);
  /* This surface is the whole point of the camera angle, and physically it is
     the brightest non-emitting part of the sign: it sits millimetres from the
     tube and faces up into its spill. The bright edge is the FRONT lip (local
     bottom once laid flat), nearest the tube. */
  background:
    /* specular: a hard bright line right on the front lip where the metal
       turns past the tube. Painted metal always catches this and its absence
       is what makes a CSS box read as flat shading rather than a surface. */
    linear-gradient(to top,
      rgb(255 245 235 / calc(.85 * var(--lvl,0))) 0%,
      rgb(255 208 165 / calc(.50 * var(--lvl,0))) 4%,
      rgb(240 121 62  / calc(.30 * var(--lvl,0))) 20%,
      rgb(240 121 62  / calc(.10 * var(--lvl,0))) 52%,
      transparent 86%),
    linear-gradient(#2E3036,#1C1E22 55%,#131417);
}
/* left end cap — visible because the camera is left of centre */
.endL{
  width:var(--d); height:var(--h);
  transform:translate(-50%,-50%) rotateY(-90deg) translateZ(calc(var(--w)/2));
  border-radius:calc(var(--d)/2);
  background:
    linear-gradient(90deg,
      rgb(255 246 238 / calc(.70 * var(--lvl,0))) 0%,
      rgb(255 190 140 / calc(.34 * var(--lvl,0))) 5%,
      rgb(240 121 62  / calc(.12 * var(--lvl,0))) 42%, transparent 80%),
    linear-gradient(#232529,#141519);
}
.back{
  width:var(--w); height:var(--h);
  transform:translate(-50%,-50%) translateZ(calc(var(--d)/-2)) rotateY(180deg);
  border-radius:calc(var(--h)/2); background:#0A0B0D;
}

/* ---- tube + lettering, both in the face's own local space ---------------- */
.frame{position:absolute; inset:0; overflow:visible; pointer-events:none;
  --tube:15px;      /* GLASS DIAMETER — every layer below derives from it */
}
.frame path,.frame line{fill:none; stroke-linecap:round; stroke-linejoin:round}

/* A neon tube is a CYLINDER of glass, and that is the whole trick to making it
   read as round instead of as a drawn line. Seen head-on, the centre line is
   blown out to white and the brightness falls off across the tube's width to
   the saturated gas colour at the glass walls. So the stack is not "line plus
   blur" — it is a cross-section: body at full diameter, a hotter band at ~60%,
   a white core at ~30%, with the halo and bloom outside it. Widths are all
   multiples of --tube, so a fatter tube is a one-number change. */
.t-glass{stroke:var(--glass); stroke-width:var(--tube); opacity:.32}
.t-bloom{stroke:var(--gas-deep); stroke-width:calc(var(--tube)*2.5); filter:blur(21px);
  opacity:calc(.52 * var(--bloom,0) * (1 - .65 * var(--warm,0)))}
.t-halo {stroke:var(--gas); stroke-width:calc(var(--tube)*1.6);  filter:blur(11px);
  opacity:calc(.80 * var(--lvl,0))}
.t-body {stroke:var(--gas); stroke-width:var(--tube);            filter:blur(2.6px);
  opacity:calc(.95 * var(--lvl,0))}
.t-inner{stroke:#FFC89C;   stroke-width:calc(var(--tube)*.60);   filter:blur(1.6px);
  opacity:calc(.95 * var(--lvl,0))}
.t-core {stroke:#FFFFFF;   stroke-width:calc(var(--tube)*.30);   filter:blur(.6px);
  opacity:calc(1 * var(--lvl,0))}
.t-elec {stroke:var(--gas-cold); stroke-width:calc(var(--tube)*.95); filter:blur(6px);
  opacity:calc(.70 * var(--lvl,0))}
.lead   {stroke:#2A2724; stroke-width:2; opacity:.9}
.housing{fill:#141210; stroke:#2A2724; stroke-width:1}

/* ---- the directional arrow ----------------------------------------------
   A real animated neon arrow is not a gradient wipe. It is several SEPARATE
   tubes, each on its own switched supply, fired in sequence — which is why the
   travel looks stepped rather than smooth, and why each step arrives instantly.
   Each <g class="seg"> is one tube and carries its own --s (emission) and --sb
   (halo), set per frame from the same discharge model as the border.        */
/* Same cross-section treatment, on a thinner tube than the border — the arrow
   is a secondary element and should not compete with the frame.

   Paths are ordered BY LAYER across all segments (every bloom, then every
   halo, ... then every core) rather than segment-by-segment. Stacking whole
   segments meant the next segment's wide dark bloom painted over the previous
   segment's white core, punching a visible notch at every join — it read as
   gaps in the tube even though the geometry overlaps by 4px. Each path is
   tagged with its segment index and picks up that segment's level below. */
.frame{--atube:8.5px}
.frame [data-seg="0"]{--s:var(--s0,0); --sb:var(--sb0,0)}
.frame [data-seg="1"]{--s:var(--s1,0); --sb:var(--sb1,0)}
.frame [data-seg="2"]{--s:var(--s2,0); --sb:var(--sb2,0)}
.frame [data-seg="3"]{--s:var(--s3,0); --sb:var(--sb3,0)}
.frame [data-seg="4"]{--s:var(--s4,0); --sb:var(--sb4,0)}
.frame [data-seg="5"]{--s:var(--s5,0); --sb:var(--sb5,0)}
.a-glass{stroke:var(--glass); stroke-width:var(--atube); opacity:.30}
.a-bloom{stroke:var(--gas-deep); stroke-width:calc(var(--atube)*2.5); filter:blur(13px);
  opacity:calc(.58 * var(--sb,0))}
.a-halo {stroke:var(--gas); stroke-width:calc(var(--atube)*1.6);  filter:blur(6.5px);
  opacity:calc(.82 * var(--s,0))}
.a-body {stroke:var(--gas); stroke-width:var(--atube);            filter:blur(1.9px);
  opacity:calc(.95 * var(--s,0))}
.a-inner{stroke:#FFC89C;   stroke-width:calc(var(--atube)*.60);   filter:blur(1.1px);
  opacity:calc(.95 * var(--s,0))}
.a-core {stroke:#FFFFFF;   stroke-width:calc(var(--atube)*.32);   filter:blur(.5px);
  opacity:calc(1 * var(--s,0))}

/* Lifted off centre to leave the lower third of the face for the arrow. */
.word{display:grid; place-items:center; position:relative; z-index:1;
  transform:translateY(calc(var(--h) * -0.14))}
.word > span{
  grid-area:1/1; white-space:nowrap; text-align:center;
  /* Sized against the face's LAYOUT width. Judging this by eye from a
     screenshot is a trap: the on-screen box is the 3D-rotated projection and
     reads ~25% narrower than the text actually is, so the type looks like it
     has room to grow when it is already overflowing the tube. Tighter tracking
     buys back the width needed to keep it legible. */
  font-size:calc(var(--w) * .062); font-weight:600;
  letter-spacing:.11em; text-transform:uppercase; line-height:1.3;
  /* Thinner than before: at this size 1.7px read as a chunky drawn outline
     rather than bent glass. The brightness now comes from the glow, not from
     the weight of the stroke. */
  color:transparent; -webkit-text-stroke:1.25px var(--glass);
}
.glass{-webkit-text-stroke-color:rgb(92 97 87 / .45)}
.lit{
  /* Pure white and fully opaque. Letter tube at night is BLOWN OUT — the
     previous warm off-white at partial alpha is what made it read as grey
     paint instead of light. */
  -webkit-text-stroke-color:rgb(255 255 255 / calc(1 * var(--lvl,0)));
  text-shadow:
    0 0 calc(1.5px + 1px  * var(--bloom,0)) rgb(255 255 255 / calc(1   * var(--lvl,0))),
    0 0 calc(3px  + 2px  * var(--bloom,0)) rgb(255 236 214 / calc(1   * var(--lvl,0))),
    0 0 calc(7px  + 4px  * var(--bloom,0)) rgb(255 176 112 / calc(.98 * var(--lvl,0))),
    0 0 calc(15px + 10px * var(--bloom,0)) rgb(240 121 62  / calc(.92 * var(--lvl,0))),
    0 0 calc(32px + 22px * var(--bloom,0)) rgb(232 104 46  / calc(.62 * var(--bloom,0))),
    0 0 calc(64px + 46px * var(--bloom,0)) rgb(178 64 26   / calc(.38 * var(--bloom,0) * (1 - .6 * var(--warm,0))));
}

/* ---- legs ---------------------------------------------------------------- */
.leg{position:absolute; left:50%; top:50%; transform-style:preserve-3d;
  width:30px; height:var(--legH)}
.leg > i{position:absolute; inset:0; display:block; border-radius:2px}
/* Legs pick up the sign above them: warm at the top, falling to black at the
   foot, plus a specular stripe down the edge facing the tube. Flat dark bars
   are the giveaway that nothing in the scene is lighting anything else. */
.leg > i.f{transform:translateZ(14px);
  background:
    linear-gradient(90deg, transparent 30%,
      rgb(255 200 150 / calc(.16 * var(--lvl,0))) 45%, transparent 60%),
    linear-gradient(#0C0D0F,#2C2E34 42%,#15171A);
  box-shadow:inset 0 26px 30px -22px rgb(240 121 62 / calc(.55 * var(--lvl,0)));}
.leg > i.s{width:28px; transform:rotateY(-90deg) translateZ(15px);
  background:linear-gradient(#1F2126,#0C0D0F);
  box-shadow:inset 0 24px 26px -20px rgb(240 121 62 / calc(.30 * var(--lvl,0)));}
.legL{transform:translate(-50%,-50%) translateX(calc(var(--w)/-4))
      translateY(calc(var(--h)/2 + var(--legH)/2))}
.legR{transform:translate(-50%,-50%) translateX(calc(var(--w)/4))
      translateY(calc(var(--h)/2 + var(--legH)/2))}

/* ---- panel --------------------------------------------------------------- */
.panel{display:flex; flex-wrap:wrap; align-items:center; gap:.55rem;
  padding:.8rem clamp(1rem,4vw,2rem) 1rem;
  border-top:1px solid rgb(230 221 210/.09); background:#050403}
.panel button{font:inherit; font-size:.74rem; letter-spacing:.1em; text-transform:uppercase;
  color:#CABEB0; background:transparent; border:1px solid rgb(230 221 210/.18);
  border-radius:999px; padding:.48rem .95rem; cursor:pointer}
.panel button:hover{border-color:var(--gas); color:var(--gas)}
.panel button[aria-pressed="true"]{border-color:var(--gas); color:var(--gas);
  background:rgb(240 121 62/.10)}
.ctrl{display:flex; align-items:center; gap:.5rem; font-size:.68rem;
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
.ctrl input{width:120px; accent-color:#F0793E}
.ctrl b{color:#CABEB0; font-variant-numeric:tabular-nums; min-width:3.4em}
.spacer{flex:1 1 1rem}
.readout{font-size:.68rem; letter-spacing:.09em; text-transform:uppercase;
  color:var(--muted); font-variant-numeric:tabular-nums}
.readout b{color:#CABEB0}
</style>
</head>
<body>

<main class="scene">
  <div class="world" id="world">
    <div class="rig" id="rig">
      <div class="ground"></div>
      <div class="pool"></div>
      <a class="slab" id="slab" href="#build-strategy">
        <div class="back"></div>
        <div class="endL"></div>
        <div class="top"></div>
        <div class="face" id="face">
          <svg class="frame" id="frame" aria-hidden="true"></svg>
          <span class="word">
            <span class="glass" aria-hidden="true">Start building</span>
            <span class="lit">Start building</span>
          </span>
        </div>
      </a>
      <div class="leg legL"><i class="f"></i><i class="s"></i></div>
      <div class="leg legR"><i class="f"></i><i class="s"></i></div>
    </div>
  </div>
  <div class="glare"></div>
  <div class="grain"></div>
</main>

<div class="panel">
  <button id="replay">Replay</button>
  <button id="reseed">New flicker</button>
  <button id="safe" aria-pressed="true">Flash-safe</button>
  <button id="calm" aria-pressed="false">Reduced motion</button>
  <span class="ctrl">Yaw <input id="yaw" type="range" min="0" max="70" value="40"><b id="yawV">40°</b></span>
  <span class="ctrl">Pitch <input id="pitch" type="range" min="0" max="45" value="13"><b id="pitchV">17°</b></span>
  <span class="spacer"></span>
  <span class="readout">Phase <b id="r-phase">—</b> &nbsp; Emission <b id="r-lvl">0%</b></span>
</div>

<script>
"use strict";
/* ==========================================================================
   Discharge engine — identical to index.html. Notes live in that file and in
   README.md; the short version is that a neon tube switches in microseconds
   with no afterglow, so the tube edge is a hard step and only the halo lags,
   and every frame is the 1 kHz time-integral of emission across that frame so
   the 100 Hz mains ripple cannot alias into a 20 Hz strobe at 60 fps.
   ========================================================================== */
const MAINS_HZ=50, RIPPLE_HZ=MAINS_HZ*2, RIPPLE_DEPTH=0.14;
const RIPPLE_NORM=1/(1-RIPPLE_DEPTH/2);
const SUB_MS=1, TAU_ATTACK=12, TAU_RELEASE=55;
const PULSES=3, PULSE_MS=1150, PULSE_FLOOR=0.30;
const DARK_MS=420, HOLD_MS=3800, REST_MS=900;
const SAFE_MIN_STRIKE_GAP=340;
let SAFE=true;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function buildTake(seed){
  const rnd=mulberry32(seed); const seg=[]; let t=0;
  const push=(d,o)=>{seg.push(Object.assign({t0:t,t1:t+d},o)); t+=d;};
  push(DARK_MS,{kind:"dark",phase:"dark"});
  for(let i=0;i<PULSES;i++) push(PULSE_MS,{kind:"pulse",phase:"pulse "+(i+1)+"/"+PULSES});
  const n=7+Math.floor(rnd()*4);
  for(let i=0;i<n;i++){
    const last=i===n-1;
    push(rnd()<0.22?180+rnd()*260:14+rnd()*95,{kind:"off",phase:"flicker"});
    if(rnd()<0.55) push(5+rnd()*16,{kind:"partial",a:0.18+rnd()*0.28,phase:"flicker"});
    let on=last?240+rnd()*120:28+rnd()*190;
    if(SAFE) on=Math.max(on,SAFE_MIN_STRIKE_GAP);
    push(on,{kind:"on",a:0.86+rnd()*0.14,ph:rnd()*6.283,phase:"flicker"});
  }
  push(HOLD_MS,{kind:"steady",phase:"steady"});
  push(REST_MS,{kind:"dark",phase:"dark"});
  return {seg,total:t,seed};
}
function ripple(t){
  const ph=2*Math.PI*RIPPLE_HZ*(t/1000);
  return (1-RIPPLE_DEPTH*(0.5-0.5*Math.cos(ph)))*RIPPLE_NORM;
}
function emit(take,t){
  const T=take.total; t=((t%T)+T)%T;
  let s=take.seg[take.seg.length-1];
  for(let i=0;i<take.seg.length;i++){ if(t<take.seg[i].t1){ s=take.seg[i]; break; } }
  const u=(t-s.t0)/(s.t1-s.t0);
  switch(s.kind){
    case "dark":    return {a:0,warm:0,phase:s.phase};
    case "off":     return {a:0,warm:1,phase:s.phase};
    case "partial": return {a:s.a,warm:1,phase:s.phase};
    case "pulse":{
      const a=PULSE_FLOOR+(1-PULSE_FLOOR)*Math.sin(Math.PI*u)**2;
      return {a:Math.min(1,a*ripple(t)),warm:(1-a)*0.35,phase:s.phase};
    }
    case "on":{
      const age=t-s.t0;
      const wob=1+0.13*Math.sin(2*Math.PI*62*(age/1000)+s.ph)*Math.exp(-age/22);
      return {a:Math.min(1,s.a*wob*ripple(t)),warm:0.25*Math.exp(-age/60),phase:s.phase};
    }
    case "steady":{
      const drift=1+0.012*Math.sin(t/730)+0.007*Math.sin(t/271);
      return {a:Math.min(1,ripple(t)*drift),warm:0,phase:s.phase};
    }
  }
  return {a:0,warm:0,phase:"dark"};
}

/* ---- driver -------------------------------------------------------------- */
const root=document.documentElement;
const face=document.getElementById("face");
const frame=document.getElementById("frame");
const slab=document.getElementById("slab");
const rPhase=document.getElementById("r-phase"), rLvl=document.getElementById("r-lvl");

let take=buildTake(20260803);
let t0=performance.now(), prevT=0, bloom=0, warmS=0;
let calm=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---- arrow timing --------------------------------------------------------
   Segments fire left to right, all hold lit, then all extinguish and it runs
   again. ~130 ms between strikes is the classic arrow-sign cadence: fast
   enough to read as travel, slow enough that each tube reads as a tube.     */
const ARROW_SHAFT_SEGS = 5;
const ARROW_SEGS = ARROW_SHAFT_SEGS + 1;      // + the head
const SEG_STEP = 130, ARROW_HOLD = 620, ARROW_GAP = 320;
const ARROW_CYCLE = ARROW_SEGS*SEG_STEP + ARROW_HOLD + ARROW_GAP;
let segState = [];   /* per-segment halo state; levels go to --s0..--s5 on .frame */
/* fixed per-segment phase so each tube's strike wobble differs but is stable */
const SEG_PHASE = Array.from({length:ARROW_SEGS}, (_,i) => (i*2.399) % 6.283);

/* The tube path is built in the face's OWN layout space. getBoundingClientRect
   would return the screen-space bounding box of a 3D-rotated element, which is
   not the face's geometry — offsetWidth/offsetHeight are the untransformed
   size and are what the SVG viewBox needs. */
/* Arrow tubes, laid out under the lettering and pointing right. Returns one
   path per SEGMENT — the head is a single segment so both of its arms strike
   together, which is how a real arrow sign is wired. */
function arrowSegments(w,h){
  const ay = h*0.73;
  const span = w*0.235;
  const ax0 = w/2-span, ax1 = w/2+span;
  const headLen = Math.min(46, span*0.40), headHalf = h*0.125;
  const shaftEnd = ax1-headLen*0.55;
  const n = ARROW_SHAFT_SEGS;
  const segs = [];
  for(let i=0;i<n;i++){
    const x0 = ax0+(shaftEnd-ax0)*i/n;
    const x1 = ax0+(shaftEnd-ax0)*(i+1)/n;
    // Overlap so the shaft is continuous when every segment is lit. The slight
    // brightening left at each join is wanted, not a defect: a real segmented
    // arrow has an electrode pair at every tube end, and they run hotter.
    segs.push(`M ${x0} ${ay} L ${x1+4} ${ay}`);
  }
  segs.push(`M ${ax1-headLen} ${ay-headHalf} L ${ax1} ${ay} L ${ax1-headLen} ${ay+headHalf}`);
  return segs;
}

function drawFrame(){
  const w=face.offsetWidth, h=face.offsetHeight;
  if(!w||!h) return;
  const aSegs = arrowSegments(w,h);
  const rad=Math.min(h/2,h/2), gap=26;
  const d=[`M ${w/2-gap/2} ${h}`,`H ${rad}`,`A ${rad} ${rad} 0 0 1 0 ${h-rad}`,
    `V ${rad}`,`A ${rad} ${rad} 0 0 1 ${rad} 0`,`H ${w-rad}`,
    `A ${rad} ${rad} 0 0 1 ${w} ${rad}`,`V ${h-rad}`,
    `A ${rad} ${rad} 0 0 1 ${w-rad} ${h}`,`H ${w/2+gap/2}`].join(" ");
  const L=w/2-gap/2, R=w/2+gap/2;
  frame.setAttribute("viewBox",`0 0 ${w} ${h}`);
  frame.innerHTML=`
    <path class="t-glass" d="${d}"/>
    <path class="t-bloom" d="${d}"/><path class="t-halo" d="${d}"/>
    <path class="t-body"  d="${d}"/>
    <line class="t-elec" x1="${L-16}" y1="${h}" x2="${L}" y2="${h}"/>
    <line class="t-elec" x1="${R}" y1="${h}" x2="${R+16}" y2="${h}"/>
    <path class="t-inner" d="${d}"/><path class="t-core" d="${d}"/>
    <line class="lead" x1="${L}" y1="${h}" x2="${L}" y2="${h+10}"/>
    <line class="lead" x1="${R}" y1="${h}" x2="${R}" y2="${h+10}"/>
    <rect class="housing" x="${L-4}" y="${h+8}" width="${gap+8}" height="7" rx="2"/>
    ${aSegs.map(d =>
      // unlit glass first so an extinguished segment is still a visible tube
      `<path class="a-glass" d="${d}"/>`).join("")}
    ${["a-bloom","a-halo","a-body","a-inner","a-core"].map(cls =>
      aSegs.map((d,i) => `<path class="${cls}" data-seg="${i}" d="${d}"/>`).join("")
    ).join("")}`;
  segState = aSegs.map(() => ({ b:0 }));
}

function step(now){
  requestAnimationFrame(step);
  if(calm){
    root.style.setProperty("--lvl","1");
    root.style.setProperty("--bloom","1");
    root.style.setProperty("--warm","0");
    // reduced motion: the arrow is simply lit, not travelling
    for(let i=0;i<ARROW_SEGS;i++){
      frame.style.setProperty("--s"+i,"1"); frame.style.setProperty("--sb"+i,"1");
    }
    rPhase.textContent="reduced motion"; rLvl.textContent="100%";
    return;
  }
  const t=now-t0;
  const win=Math.min(t-prevT,120);
  const steps=Math.max(1,Math.round(win/SUB_MS)), dt=win/steps;
  let sum=0,warmSum=0,phase="";
  for(let i=0;i<steps;i++){
    const e=emit(take,prevT+dt*(i+0.5));
    sum+=e.a; warmSum+=e.warm; phase=e.phase;
    const tau=e.a>bloom?TAU_ATTACK:TAU_RELEASE;
    bloom+=(e.a-bloom)*(1-Math.exp(-dt/tau));
  }
  prevT=t;
  const lvl=sum/steps;
  warmS+=(warmSum/steps-warmS)*0.25;
  root.style.setProperty("--lvl",lvl.toFixed(4));
  root.style.setProperty("--bloom",bloom.toFixed(4));
  root.style.setProperty("--warm",warmS.toFixed(4));
  /* -- the arrow ----------------------------------------------------------
     Separate tubes on the same transformer, so when the main tube drops out
     mid-flicker these go with it — an arrow that kept chasing through a
     dropout would give the whole illusion away. */
  const powered = lvl > 0.06;
  const ta = ((now - t0) % ARROW_CYCLE);
  const allOn = ARROW_SEGS*SEG_STEP + ARROW_HOLD;
  for(let i=0;i<segState.length;i++){
    const age = ta - i*SEG_STEP;                 // ms since this tube struck
    const on  = powered && age >= 0 && ta < allOn;
    let s = 0;
    if(on){
      // same streamer instability as the main tube, decaying over ~20 ms
      const wob = 1 + 0.11*Math.sin(2*Math.PI*62*(age/1000)+SEG_PHASE[i])*Math.exp(-age/20);
      s = Math.min(1, wob*ripple(t));
    }
    const st = segState[i];
    const tau = s > st.b ? TAU_ATTACK : TAU_RELEASE;
    st.b += (s - st.b)*(1 - Math.exp(-win/tau));
    frame.style.setProperty("--s"+i,  s.toFixed(3));
    frame.style.setProperty("--sb"+i, st.b.toFixed(3));
  }

  rPhase.textContent=phase; rLvl.textContent=Math.round(lvl*100)+"%";
}

/* ---- controls ------------------------------------------------------------ */
function restart(seed){
  take=buildTake(seed===undefined?take.seed:seed);
  t0=performance.now(); prevT=0; bloom=0; warmS=0;
}
document.getElementById("replay").onclick=()=>restart();
document.getElementById("reseed").onclick=()=>restart((Math.random()*1e9)|0);
document.getElementById("safe").onclick=e=>{
  SAFE=!SAFE; e.currentTarget.setAttribute("aria-pressed",String(SAFE)); restart();
};
document.getElementById("calm").onclick=e=>{
  calm=!calm; e.currentTarget.setAttribute("aria-pressed",String(calm)); if(!calm) restart();
};
const yaw=document.getElementById("yaw"), pitch=document.getElementById("pitch");
const yawV=document.getElementById("yawV"), pitchV=document.getElementById("pitchV");
function cam(){
  root.style.setProperty("--yaw", yaw.value+"deg");
  root.style.setProperty("--pitch", (-pitch.value)+"deg");
  yawV.textContent=yaw.value+"°"; pitchV.textContent=pitch.value+"°";
}
yaw.oninput=cam; pitch.oninput=cam; cam();
slab.addEventListener("click",e=>{e.preventDefault(); restart();});

new ResizeObserver(drawFrame).observe(face);
addEventListener("resize",drawFrame);
drawFrame();
requestAnimationFrame(step);
</script>
</body>
</html>
