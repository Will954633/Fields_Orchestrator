<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Fields — the fridge</title>
<link rel="stylesheet" href="fridge.css">
</head>
<body>

<!--
  Concept prototype for the /fridge landing page.

  The four <a> elements below are real links, present in the initial HTML and
  merely occluded by the door. That is deliberate and it is the contract: on the
  real site the door has to paint and swing from SSR HTML + CSS alone, because
  the current destination ships 219 KB of JS before React can animate anything.
  JS here only decides WHEN to open — never whether the content exists.

  Query params for comparing on a handset without a rebuild:
    ?art=mono   drawing in greyscale instead of colour
    ?sound=0    silent
    ?debug=1    log events + audio state to the console
-->

<main class="room">

  <!-- Keyboard/screen-reader control. The door is decorative; the options below
       are reachable regardless of whether it ever opens. -->
  <button type="button" class="srToggle" id="srToggle" aria-expanded="false" aria-controls="shelves">
    Open the fridge
  </button>

  <button type="button" class="muteBtn" id="muteBtn" aria-label="Mute the fridge" aria-pressed="false">&#9834;</button>

  <div class="stage">
    <div class="fridge" id="fridge">

      <!-- interior -->
      <div class="cavity">
        <!-- Behind everything: what the secret door reveals. A still, not a
             live <iframe> — an iframe fires the homepage's own analytics, costs
             a full page load per visit, and can reveal a BLANK box if it hasn't
             painted, which would ruin the one moment it exists for.
             Regenerate with assets/build_home_shot.mjs when the homepage
             changes. -->
        <div class="vault" aria-hidden="true"><img class="vaultShot" src="assets/home.webp" alt="" width="758" height="1640"></div>

        <!-- Everything the fridge normally shows. Hinges down as one panel. -->
        <div class="innerPanel">
        <div class="lamp"></div>
        <!-- The secret button. It was on the inside of the DOOR, which turned
             out to be impossible to see: on a portrait phone a left-hinged door
             is edge-on at 90 degrees and swung out of frame past that (measured
             — the inner face rendered 5px wide, then landed at screen x=-113).
             So it lives where a real fridge puts its unlabelled controls: the
             top of the cabinet beside the lamp. Small, no label, only reachable
             once the door is open. -->
        <button type="button" class="secret" id="secret" aria-label="Reveal what's behind the fridge"></button>
        <p class="eyebrow" id="eyebrow"></p>
        <ul class="shelves" id="shelves">
          <li class="shelf">
            <a href="https://fieldsestate.com.au/market-intelligence" id="optMarket">
              <span class="label" id="optMarketLabel">What's happening in your market
                <span class="sub">Prices, supply and days on market</span></span>
              <span class="go" aria-hidden="true">→</span>
            </a>
          </li>
          <li class="shelf">
            <a href="https://fieldsestate.com.au/recently-sold">
              <span class="label">What sold near you recently
                <span class="sub">Every settled sale, with the actual price</span></span>
              <span class="go" aria-hidden="true">→</span>
            </a>
          </li>
          <li class="shelf">
            <a href="https://fieldsestate.com.au/for-sale">
              <span class="label">What's for sale nearby
                <span class="sub">Everything currently on the market</span></span>
              <span class="go" aria-hidden="true">→</span>
            </a>
          </li>
          <li class="shelf">
            <a href="https://fieldsestate.com.au/analyse-your-home">
              <span class="label">What's my home worth
                <span class="sub">A comparable range, and how we got there</span></span>
              <span class="go" aria-hidden="true">→</span>
            </a>
          </li>
        </ul>
        <!-- Owns interior darkness AND the lamp strike. Must stay
             pointer-events:none — it sits above the option links. -->
        <div class="flick"></div>
        </div><!-- /.innerPanel -->
      </div>

      <!-- door -->
      <div class="door" aria-hidden="true">
        <div class="back">
          <span class="doorShelf a"></span>
          <span class="doorShelf b"></span>
          <span class="doorShelf c"></span>
        </div>
        <div class="edge"></div>
        <div class="face">
          <!-- A child's drawing, held up by two Fields magnets. Swap
               artwork.svg for a real photo (assets/artwork.jpg) and it just
               works — the sheet is sized by its own aspect ratio. -->
          <div class="art">
            <img class="artSheet" src="assets/artwork.svg" alt="" width="1560" height="1103">
            <img class="magnet ml" src="assets/magnet.webp" alt="" width="440" height="269">
            <img class="magnet mr" src="assets/magnet.webp" alt="" width="440" height="269">
          </div>
          <!-- Manufacturer badge: the Fields icon debossed into the steel.
               A CSS mask, so it is filled with the same metal as the door and
               lit by the same light — an <img> would sit ON the door rather
               than being part of it. -->
          <span class="badge" aria-hidden="true"></span>
          <span class="handle"></span>
          <span class="seam"></span>
        </div>
      </div>

    </div>
    <p class="prompt" aria-hidden="true">Tap to open</p>
  </div>
</main>

<script src="fridgeAudio.js"></script>
<script src="fridge.js"></script>
</body>
</html>
