# ─────────────────────────────────────────────────────────────────────────────
# Dated market/policy events for the "What's changed recently" block.
#
# WHERE THESE COME FROM
# Extracted by hand from the monthly homeowner research —
# 15_Off-Market/Home_Owner_Perspective/Gold-Coast-Homeowner-Selling-Mindset-<date>.md
# Only rows the research tags [VERIFIED] may appear here. An [INFERRED] emotional
# read is our interpretation and must never be published as an event.
#
# ⚠ EVERY EVENT MUST PAIR WITH A LOCAL READING FROM OUR OWN DATA.
# A national headline on its own tells a Robina owner nothing about their home,
# and repeating it unpaired is how a report becomes the anxiety it is supposed to
# answer. `local_metric` names which of our measured series the generator must
# put beside it. If we cannot measure the local side, the event does not render.
#
# ⚠ NO CAUSAL VERBS. "coincided with", "over the same period", "since" — never
# "caused", "drove", "led to". We are pairing two measured series in time, and
# that is all we can support (CLAUDE.md Rule 5).
#
# ⚠ NO FORECASTS, even attributed ones. "Westpac expects two cuts in 2027" is a
# prediction the moment it appears on a homeowner's report, whoever said it.
# ─────────────────────────────────────────────────────────────────────────────

events:
  - id: cgt_ng_reform
    date: 2026-05-12
    scope: national
    # ⚠ DATED TO THE ANNOUNCEMENT, not to Royal Assent (26 June). Behaviour
    # changes when a policy becomes known, not when it is signed — and our own
    # active-listing snapshots start 21 February, so 11 May is a genuine
    # pre-announcement baseline rather than an arbitrary one.
    #
    # ⚠ TWO local metrics, because the interesting local fact is that they moved
    # in OPPOSITE directions: supply and time-on-market shifted while price did
    # not. Either one alone tells half the story.
    statement: >-
      Negative gearing and capital gains tax changes were announced on 12 May 2026
      and received Royal Assent on 26 June, taking effect 1 July 2027. They apply
      to investment purchases; the main residence exemption is unchanged.
    local_metric: active_listings
    local_metric_2: median_price
    source: "Commonwealth legislation · via Fields monthly market research, 2 August 2026"

  - id: cash_rate_path
    # ⚠ ONE CASH-RATE BULLET, RE-ANCHORED TO THE LATEST DECISION. Adding the
    # 11 August hold as a SECOND event silently published nothing: both bullets
    # pair with days_on_market, `_dedupe_readings` saw the same "34 days" twice
    # and kept the earlier one, so the newer, truer bullet was the one dropped.
    # Every local metric is already spoken for, so a second cash-rate event can
    # never carry a local reading of its own — which makes one bullet, moved
    # forward as decisions land, the only shape that works here.
    #
    # ⚠ 2026-02-01 put this 190 days back and the six-month window silently
    # dropped it — the bullet vanished with no error. Any future re-anchoring
    # must stay inside WINDOW_DAYS of the generation date.
    #
    # ⚠ DAYS ON MARKET ONLY. The policy event owns active listings; this one owns
    # how long a home takes to sell. Each bullet must carry a local reading the
    # other does not, or the second is padding.
    date: 2026-08-11
    scope: national
    # ⚠ OUTCOME ONLY, NO READ-THROUGH. "Held at 4.35%" is the fact. What a hold
    # means for the reader's home, or for what 29 September might bring, is a
    # forecast (Rule 5) — the local reading beside it is the whole commentary.
    #
    # ⚠ RESOLVES THE `rba_2026_08_11` WATCH, which promised we would re-read the
    # local numbers against this decision and update the page. Setting `outcome:`
    # on that watch only STOPS the "coming up" line; it publishes nothing. The
    # two must always be written together or the page quietly breaks its promise.
    statement: >-
      The Reserve Bank held the cash rate at 4.35%, a second consecutive hold
      after the rises in February, March and May 2026 — a reversal for a market
      that had spent 2025 waiting for cuts.
    local_metric: days_on_market
    source: "RBA media release 2026-19, 11 August 2026"

  - id: national_prices_fall
    date: 2026-07-31
    scope: national
    # ⚠ Brisbane is roughly flat, not falling. The aggregate without that line
    # is the number the research says nobody reads the decimal on.
    statement: >-
      National home values fell 2.0% over the July 2026 quarter across the five
      largest capitals, led by Sydney (−3.7%) and Melbourne (−3.0%). Brisbane was
      close to flat at −0.1%.
    local_metric: median_price
    source: "Cotality 5-city aggregate, July 2026 · via Fields monthly market research"

# ─────────────────────────────────────────────────────────────────────────────
# WATCH — the one thing coming that will move this narrative.
#
# Purpose: a dated reason to come back. Not a forecast.
#
# ⚠ NEVER STATE OR IMPLY THE OUTCOME. Not "if rates fall…", not "economists
# expect…", not "this could mean…". An attributed forecast is still a forecast
# once it is on a homeowner's report (CLAUDE.md Rule 5). What is allowed: the
# decision is scheduled, here is the local number it will be read against, and
# we will publish what actually happened.
#
# ⚠ `metric_to_watch` MUST be a metric we already publish for that suburb.
# Promising to re-read something we do not measure is a promise we cannot keep,
# and this line's whole value is that the reader can check we kept it.
#
# ⚠ AN EXPIRED WATCH MUST NOT RENDER. Once `date` has passed and no `outcome`
# has been written, the generator drops the point and warns on stderr. A page
# still saying "coming up 11 August" on 15 August is worse than saying nothing —
# it proves nobody is home. Writing `outcome` converts it into a normal dated
# event and it moves into the timeline in the right chronological position.
# ─────────────────────────────────────────────────────────────────────────────
watch:
  - id: rba_2026_08_11
    date: 2026-08-11
    statement: >-
      The Reserve Bank hands down its next cash rate decision on Tuesday
      11 August 2026.
    metric_to_watch: days_on_market
    # ⚠ RESOLVED 2026-08-13. Setting this does NOT publish the result — it only
    # stops the "coming up" line rendering. The result is published by the
    # `cash_rate_path` event above, re-anchored to 11 August; the two must be
    # written together or the page goes quiet on a promise it made.
    outcome: held at 4.35% — published via event `cash_rate_path`
    source: "RBA meeting calendar · via Fields monthly market research, 2 August 2026"

  - id: rba_2026_09_29
    date: 2026-09-29
    statement: >-
      The Reserve Bank hands down its next cash rate decision on Tuesday
      29 September 2026.
    metric_to_watch: days_on_market
    # Written the day after, alongside a new event entry — see the note above.
    outcome: null
    source: "RBA meeting calendar · rba.gov.au, verified 13 August 2026"
