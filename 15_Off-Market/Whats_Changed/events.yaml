# ─────────────────────────────────────────────────────────────────────────────
# Dated market/policy events for the "What's changed recently" block.
#
# WHERE THESE COME FROM
# Extracted by hand from the monthly homeowner research —
# 15_Off-Market/Home_Owner_Perspective/Gold-Coast-Homeowner-Selling-Mindset-<date>.md
# Only rows the research tags [VERIFIED] may appear here. An [INFERRED] emotional
# read is our interpretation and must never be published as an event.
#
# ⚠ EVERY EVENT MUST PAIR WITH A LOCAL READING FROM OUR OWN DATA.
# A national headline on its own tells a Robina owner nothing about their home,
# and repeating it unpaired is how a report becomes the anxiety it is supposed to
# answer. `local_metric` names which of our measured series the generator must
# put beside it. If we cannot measure the local side, the event does not render.
#
# ⚠ NO CAUSAL VERBS. "coincided with", "over the same period", "since" — never
# "caused", "drove", "led to". We are pairing two measured series in time, and
# that is all we can support (CLAUDE.md Rule 5).
#
# ⚠ NO FORECASTS, even attributed ones. "Westpac expects two cuts in 2027" is a
# prediction the moment it appears on a homeowner's report, whoever said it.
# ─────────────────────────────────────────────────────────────────────────────

events:
  - id: cgt_ng_reform
    date: 2026-05-12
    scope: national
    # ⚠ DATED TO THE ANNOUNCEMENT, not to Royal Assent (26 June). Behaviour
    # changes when a policy becomes known, not when it is signed — and our own
    # active-listing snapshots start 21 February, so 11 May is a genuine
    # pre-announcement baseline rather than an arbitrary one.
    #
    # ⚠ TWO local metrics, because the interesting local fact is that they moved
    # in OPPOSITE directions: supply and time-on-market shifted while price did
    # not. Either one alone tells half the story.
    statement: >-
      Negative gearing and capital gains tax changes were announced on 12 May 2026
      and received Royal Assent on 26 June, taking effect 1 July 2027. They apply
      to investment purchases; the main residence exemption is unchanged.
    local_metric: active_listings
    local_metric_2: median_price
    source: "Commonwealth legislation · via Fields monthly market research, 2 August 2026"

  - id: cash_rate_holds
    date: 2026-06-17
    scope: national
    # The direction reversal is the fact, per the research: three rises then a
    # hold, against a market that had spent 2025 waiting for cuts.
    statement: >-
      The cash rate rose in February, March and May 2026 to 4.35%, and has been
      held there since 17 June.
    local_metric: days_on_market
    local_metric_2: active_listings
    source: "RBA · via Fields monthly market research, 2 August 2026"

  - id: national_prices_fall
    date: 2026-07-31
    scope: national
    # ⚠ Brisbane is roughly flat, not falling. The aggregate without that line
    # is the number the research says nobody reads the decimal on.
    statement: >-
      National home values fell 2.0% over the July 2026 quarter across the five
      largest capitals, led by Sydney (−3.7%) and Melbourne (−3.0%). Brisbane was
      close to flat at −0.1%.
    local_metric: median_price
    source: "Cotality 5-city aggregate, July 2026 · via Fields monthly market research"
