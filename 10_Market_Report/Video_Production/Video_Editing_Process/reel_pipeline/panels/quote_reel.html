<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root{
    --ink:#F3F4F5; --muted:#9198A0; --copper:#DB7A4A; --bg:#14171A;
    --hl:rgba(219,122,74,.42); --font:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:var(--font);
    -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
  #head{position:absolute;left:64px;top:150px;width:952px;z-index:3;display:flex;flex-direction:column;gap:24px}
  .kicker{font-size:28px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--copper)}
  .kicker .dot{color:var(--muted);font-weight:700;margin:0 10px}
  .headline{font-size:62px;line-height:1.05;font-weight:800;color:var(--ink);letter-spacing:-.015em}
  /* the pan viewport occupies the vertical middle; the big "document" scrolls inside it */
  #viewport{position:absolute;left:0;top:800px;width:1080px;height:340px;z-index:2;overflow:hidden}
  #card{position:absolute;left:0;top:0;background:#fff;border-radius:26px;
    padding:46px;box-shadow:0 40px 90px -30px rgba(0,0,0,.6);will-change:transform;opacity:0}
  #imgwrap{position:relative;display:block}
  #imgwrap img{display:block;height:auto}
  .hl{position:absolute;background:var(--hl);border-radius:6px;transform:scaleX(0);transform-origin:left center}
  /* soft edge fades so text entering/leaving the pan doesn't hard-clip */
  #viewport:before,#viewport:after{content:"";position:absolute;top:0;bottom:0;width:70px;z-index:4;pointer-events:none}
  #viewport:before{left:0;background:linear-gradient(90deg,var(--bg),rgba(20,23,26,0))}
  #viewport:after{right:0;background:linear-gradient(270deg,var(--bg),rgba(20,23,26,0))}
  .source{position:absolute;left:64px;top:1836px;z-index:3;font-size:22px;font-weight:600;color:var(--muted)}
  .source b{color:var(--copper);font-weight:800}
</style>
</head>
<body>
<div id="head">
  <div class="kicker" id="kicker"></div>
  <div class="headline" id="headline"></div>
</div>
<div id="viewport"><div id="card"><div id="imgwrap"><img id="qimg"></div></div></div>
<div class="source" id="source"></div>
<script>
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const easeOut=x=>1-Math.pow(1-x,3);
const easeInOut=x=>x<0.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
function pop(t,start,dur){return clamp((t-start)/dur,0,1);}

const DEFAULT={
  kicker:"The Research · University of NSW",
  headline:"What the modelling found",
  image:"../assets/auctions_research_quote.png", image_w:1504, image_h:176,
  display_w:1900,   // rendered width of the quote image (bigger => more readable, more pan)
  highlights:[[492,10,1010,52],[22,66,1470,52],[22,120,830,52]],
  anim:{card:0.2, hl:1.4, stagger:0.4, grow:0.6, pan_start:3.0, pan_dur:9.6},
  source:"Source <b>University of New South Wales</b>",
};

let CARD, IMG, HLS=[], ANIM, PAN0=0, PAN1=0;
window.__build=function(scene){
  scene=scene||DEFAULT;
  document.getElementById('kicker').innerHTML=(scene.kicker||'').replace(/ · /g,' <span class="dot">·</span> ');
  document.getElementById('headline').innerHTML=scene.headline||'';
  document.getElementById('source').innerHTML=scene.source||'';
  const dispW=scene.display_w||DEFAULT.display_w;
  IMG=document.getElementById('qimg');
  IMG.style.width=dispW+'px';
  IMG.src=/^(file:|https?:|\.)/.test(scene.image)?scene.image:('file://'+scene.image);
  const wrap=document.getElementById('imgwrap');
  [...wrap.querySelectorAll('.hl')].forEach(e=>e.remove());
  HLS=(scene.highlights||[]).map(([x,y,w,h])=>{
    const d=document.createElement('div');d.className='hl';
    d.style.left=(x/scene.image_w*100)+'%';d.style.top=(y/scene.image_h*100)+'%';
    d.style.width=(w/scene.image_w*100)+'%';d.style.height=(h/scene.image_h*100)+'%';
    wrap.appendChild(d);return d;
  });
  CARD=document.getElementById('card');
  const pad=46, cardW=dispW+2*pad;
  // vertically centre the card in the viewport
  const imgH=scene.image_h*(dispW/scene.image_w), cardH=imgH+2*pad;
  CARD.style.top=((340-cardH)/2)+'px';
  PAN0=0; PAN1=-(cardW-1080);           // pan from showing the left edge to the right edge
  ANIM=scene.anim||DEFAULT.anim;
  window.__setT(0);
};
window.__setT=function(t){
  const c=easeOut(pop(t,ANIM.card==null?0:ANIM.card,0.5));
  CARD.style.opacity=c;
  const ps=ANIM.pan_start==null?3:ANIM.pan_start, pd=ANIM.pan_dur==null?9:ANIM.pan_dur;
  const pp=easeInOut(pop(t,ps,pd));
  CARD.style.transform=`translateX(${PAN0+(PAN1-PAN0)*pp}px)`;
  HLS.forEach((d,i)=>{const st=(ANIM.hl==null?1.4:ANIM.hl)+i*(ANIM.stagger==null?0.4:ANIM.stagger);
    const p=easeOut(pop(t,st,ANIM.grow==null?0.6:ANIM.grow));d.style.transform=`scaleX(${p})`;});
};
window.__build(null);
window.__panelReady=true;
</script>
</body>
</html>
