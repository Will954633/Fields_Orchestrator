<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root{
    --ink:#F3F4F5; --muted:#9198A0; --copper:#DB7A4A; --bg:#14171A;
    --font:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:var(--font);
    -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
  #head{position:absolute;left:64px;top:120px;width:952px;z-index:2;display:flex;flex-direction:column;gap:22px}
  .kicker{font-size:28px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--copper)}
  .kicker .dot{color:var(--muted);font-weight:700;margin:0 10px}
  .headline{font-size:60px;line-height:1.06;font-weight:800;color:var(--ink);letter-spacing:-.015em}
  /* the big stat block, upper-middle-left (PIP sits bottom-right) */
  #stat{position:absolute;left:64px;top:480px;width:940px;z-index:2;display:flex;flex-direction:column;gap:20px}
  .pre{font-size:34px;font-weight:600;color:var(--muted);line-height:1.25;max-width:820px;
    opacity:0;transform:translateY(16px)}
  .big{font-size:120px;font-weight:800;color:var(--ink);letter-spacing:-.02em;line-height:1.0;
    opacity:0;transform:translateY(22px)}
  .big b{font-size:184px;color:var(--copper);font-weight:900;letter-spacing:-.03em}
  .post{font-size:40px;font-weight:700;color:var(--ink);line-height:1.2;max-width:820px;
    opacity:0;transform:translateY(16px)}
  .source{position:absolute;left:64px;top:1840px;z-index:2;font-size:22px;font-weight:600;color:var(--muted)}
  .source b{color:var(--copper);font-weight:800}
</style>
</head>
<body>
<div id="head">
  <div class="kicker" id="kicker"></div>
  <div class="headline" id="headline"></div>
</div>
<div id="stat">
  <div class="pre" id="pre"></div>
  <div class="big" id="big"></div>
  <div class="post" id="post"></div>
</div>
<div class="source" id="source"></div>
<script>
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const easeOut=x=>1-Math.pow(1-x,3);
function pop(t,start,dur){return clamp((t-start)/dur,0,1);}

const DEFAULT={
  kicker:"New Research · University of NSW",
  headline:"Failed auctions sell for less",
  stat:{ pre:"Homes that fail to sell at auction go on to sell for",
         big:"over <b>1%</b> less", post:"than if listed as private treaty first" },
  anim:{ pre:0.4, big:1.4, post:2.4 },
  source:"Source <b>University of New South Wales</b> research",
};

let PRE,BIG,POST,ANIM;
window.__build=function(scene){
  scene=scene||DEFAULT;
  document.getElementById('kicker').innerHTML=(scene.kicker||'').replace(/ · /g,' <span class="dot">·</span> ');
  document.getElementById('headline').innerHTML=scene.headline||'';
  const s=scene.stat||{};
  PRE=document.getElementById('pre');   PRE.innerHTML=s.pre||'';
  BIG=document.getElementById('big');   BIG.innerHTML=s.big||'';
  POST=document.getElementById('post'); POST.innerHTML=s.post||'';
  document.getElementById('source').innerHTML=scene.source||'';
  ANIM=scene.anim||DEFAULT.anim;
  window.__setT(0);
};
function reveal(elm,t,st,rise){const p=easeOut(pop(t,st,0.5));elm.style.opacity=p;elm.style.transform=`translateY(${(1-p)*rise}px)`;}
window.__setT=function(t){
  reveal(PRE,t,ANIM.pre==null?0:ANIM.pre,16);
  const p=easeOut(pop(t,ANIM.big==null?0:ANIM.big,0.5));
  BIG.style.opacity=p;BIG.style.transform=`translateY(${(1-p)*22}px) scale(${0.92+0.08*p})`;
  reveal(POST,t,ANIM.post==null?0:ANIM.post,16);
};
window.__build(null);
window.__panelReady=true;
</script>
</body>
</html>
