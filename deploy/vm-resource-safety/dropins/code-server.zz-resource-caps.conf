# Fields resource-safety cap (added 2026-07-27 after OOM wedge).
# ALL Claude Code sessions (code-server + claude binaries + MCP servers) share
# this cgroup, so this single cap bounds the entire Claude-session blast radius —
# the exact thing that OOM-cascaded and wedged the VM. If exceeded, the kernel
# kills a session WITHIN this slice, never mongod or the pipeline.
# High=4G throttles only under genuine runaway (normal multi-session ~3G);
# Max=5G is the hard ceiling so one leaked session can't eat the whole box.
[Service]
MemoryHigh=4G
MemoryMax=5G
OOMScoreAdjust=500
