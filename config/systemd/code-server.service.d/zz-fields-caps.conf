# Fields VM — resource caps for the shared Claude Code slice.
# ALL Claude Code sessions (code-server, every `claude` binary, MCP servers, and
# any process they spawn — including the ugrep that `grep` is rewritten into)
# live in this ONE cgroup. These caps bound the whole Claude blast radius so a
# runaway dies in-slice rather than wedging the box.
#
# History (consolidated 2026-08-06 — supersedes zz-resource-caps.conf +
# zz-swap-cap.conf, which together were confusing: the first file's 4G/5G values
# were dead, silently overridden by the second, while its OOMScoreAdjust was
# still live):
#   2026-07-27  4G/5G, sized for the old 8 GB e2-standard-2.
#   2026-08-02  Raised to 9G/11G after the 16 GB resize. At 4G/5G the slice sat
#               pinned at memory.high with ~10 MB of page cache and 104M
#               workingset refaults — every read hit disk and the root disk
#               saturated at ~250 MB/s (81% iowait, everything in D-state).
#   2026-08-06  Consolidated into this single file. Values UNCHANGED from the
#               2026-08-02 effective set.
#
# NOTE: these caps alone do NOT prevent the failure mode seen on Aug 1 and
# Aug 6 2026. A runaway ugrep stayed *within* this cap and still wedged the box
# by driving the slice's page cache to zero, so every read missed cache and
# saturated the disk. The active defence is the runaway-search reaper in
# scripts/resource_guard.py; this file is the backstop, not the fix.
[Service]
MemoryHigh=9G
MemoryMax=11G
MemorySwapMax=4G
OOMScoreAdjust=500
