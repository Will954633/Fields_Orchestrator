# Channels whose videos are transcribed and folded into Brain 1.
#
# `library` becomes the corpus `provenance.library` and is what
# `brain1_deep.py --library "<name>"` isolates. Keep it stable — renaming it
# orphans every unit already annotated under the old name.
#
# ⚠ The market suffix in `library` is NOT decoration. The rest of Brain 1 is
# US-weighted, and mail economics, postage, consumer behaviour, regulation and
# even the seasons do not read across. A US voice and an AU voice saying the
# same thing are not two sources agreeing, and a synthesis that cannot tell them
# apart will silently apply Northern-Hemisphere spring timing and USPS pricing
# to the Gold Coast. `country` is carried onto every unit header for the same
# reason — the annotator only ever sees the header and the text.
#
# `channel_id` is the UC... id (resolve with:
#   yt-dlp --flat-playlist --playlist-items 1 --dump-single-json <url> | jq -r .channel_id )
# It is what the RSS poller uses; the @handle is not stable enough to key on.

channels:
  - library: "eXp Realty (US)"
    country: "United States"
    handle: "@eXpRealty"
    url: "https://www.youtube.com/@eXpRealty"
    channel_id: "UC43frD2HapVKMMaQM5Cf5qw"
    why: >
      Large US brokerage channel. Agent-attraction and production content;
      the interest here is prospecting, farming and follow-up method, not the
      recruiting/revenue-share material — expect a low signal-to-noise ratio.
    max_backfill: 250

  - library: "Glover U (US)"
    country: "United States"
    handle: "@GloverU"
    url: "https://www.youtube.com/@GloverU"
    channel_id: "UCIT4ylSsHJApyfsvcgraxVQ"
    why: >
      Jeff Glover's coaching channel — listing presentations, scripts, objection
      handling, prospecting and conversion method. The densest source of actual
      seller-side technique in the corpus: long-form (389 of 525 videos exceed
      10 minutes, ~264 hours total) and instructional rather than promotional.
      US market, so the same read-across caveat as eXp applies — scripts and
      psychology transfer, pricing/regulation/seasonality do not.
    max_backfill: 600

  - library: "BLAC SALT (AU)"
    country: "Australia"
    handle: "@BLAC_SALT"
    url: "https://www.youtube.com/@BLAC_SALT"
    channel_id: "UCuygO2H0YAvCn1i8h3p3Htw"
    why: >
      Australian real-estate training (Agents'Agency). Small channel, long-form
      sessions. AU market context is the reason it matters — the rest of the
      Brain 1 corpus outside Tom Panos is US-weighted.
    max_backfill: 250
